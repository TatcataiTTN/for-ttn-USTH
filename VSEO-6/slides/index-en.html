<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSEO6 — Satellite Altimetry for Continental Water Monitoring</title>
<style>
:root{
  --bg:#0b1220; --panel:#101b30; --panel2:#132140; --line:#25406b;
  --ink:#eaf0ff; --ink-dim:#9fb2d6; --accent:#4fd1c5; --accent2:#f2b84b;
  --nadir:#7aa7ff; --swot:#4fd1c5; --danger:#ff7a7a; --good:#7ee08a;
  --sw: 1160px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
#deck{position:relative;width:100vw;height:100vh;display:flex;
  transition:transform .45s cubic-bezier(.65,0,.35,1)}
.slide{flex:0 0 100vw;height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:48px 64px;position:relative}
.slide-inner{width:100%;max-width:var(--sw)}
.eyebrow{color:var(--accent);font-size:15px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
h1{font-size:40px;line-height:1.2;margin:0 0 18px;font-weight:800;letter-spacing:-.01em}
h2{font-size:29px;line-height:1.3;margin:0 0 22px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
p.lead{font-size:18px;color:var(--ink-dim);line-height:1.6;max-width:820px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card h3{margin:0 0 8px;font-size:16px;color:var(--accent2)}
.card p{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.55}
ul.bullets{margin:0;padding-left:20px;font-size:16px;line-height:1.75;color:var(--ink)}
ul.bullets li{margin-bottom:8px}
ul.bullets b{color:var(--accent2)}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:4px 12px;font-size:12.5px;color:var(--ink-dim);margin-right:6px}
.tag{display:inline-block;background:rgba(79,209,197,.15);color:var(--accent);border:1px solid rgba(79,209,197,.4);
  border-radius:7px;padding:2px 9px;font-size:12px;font-weight:700;letter-spacing:.04em}
.tag.warn{background:rgba(255,122,122,.12);color:var(--danger);border-color:rgba(255,122,122,.35)}
.tag.good{background:rgba(126,224,138,.12);color:var(--good);border-color:rgba(126,224,138,.35)}
.footcite{position:absolute;bottom:26px;left:64px;right:64px;font-size:11.5px;color:#5c6f96;
  border-top:1px solid var(--line);padding-top:8px}
.footcite a{color:#7d92c2}
.slidenum{position:absolute;bottom:26px;right:64px;font-size:12px;color:#5c6f96}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:50;transition:width .4s}
.navhint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:#425079;
  letter-spacing:.05em;z-index:50}
.center{text-align:center}
.langswitch{position:fixed;top:14px;right:18px;z-index:60;display:flex;gap:6px}
.langswitch a{text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.04em;padding:5px 12px;
  border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);background:var(--panel)}
.langswitch a.active{color:var(--accent);border-color:var(--accent);background:rgba(79,209,197,.12)}
.langswitch a:hover{color:var(--ink)}
.cover .kicker{color:var(--accent2);font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:16px}
.cover h1{font-size:52px}
.cover .sub{font-size:19px;color:var(--ink-dim);max-width:760px;margin:0 auto 26px}
.cover .meta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* ---- schedule grid ---- */
.sched-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:10px}
.sched-day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 12px;font-size:12.5px}
.sched-day .d{font-weight:800;color:var(--accent2);margin-bottom:2px;font-size:13px}
.sched-day .t{color:var(--ink-dim);margin-bottom:8px;font-size:11.5px}
.sched-day ul{margin:0;padding-left:14px;line-height:1.55;color:var(--ink)}

/* ---- module nav / roadmap ---- */
.roadmap{display:flex;flex-direction:column;gap:10px}
.rstep{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 18px}
.rstep .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--accent);
  color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.rstep .t{font-size:15.5px;font-weight:700}
.rstep .s{font-size:12.5px;color:var(--ink-dim)}

/* ---- speaker cards ---- */
.spk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.spk h3{margin:0 0 3px;font-size:16.5px;color:var(--ink)}
.spk .aff{font-size:12.5px;color:var(--accent);margin-bottom:8px}
.spk ul{margin:0;padding-left:16px;font-size:12px;line-height:1.55;color:var(--ink-dim)}

/* ---- SVG diagram scaffolding ---- */
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
svg text{font-family:inherit}
.lbl{fill:var(--ink);font-size:13px}
.lbl-dim{fill:var(--ink-dim);font-size:11.5px}
.lbl-accent{fill:var(--accent);font-size:12px;font-weight:700}

/* radar pulse: nadir round trip */
@keyframes pulseDown{
  0%{ transform:translateY(0); opacity:1; }
  48%{ transform:translateY(150px); opacity:1; }
  50%{ transform:translateY(150px); opacity:0; }
  100%{ transform:translateY(150px); opacity:0; }
}
@keyframes pulseUp{
  0%{ transform:translateY(150px); opacity:0; }
  50%{ transform:translateY(150px); opacity:0; }
  52%{ transform:translateY(150px); opacity:1; }
  100%{ transform:translateY(0); opacity:1; }
}
.pulse-down{animation:pulseDown 2.6s ease-in-out infinite}
.pulse-up{animation:pulseUp 2.6s ease-in-out infinite}

/* satellite moving along track (KaRIn) */
@keyframes flyRight{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(430px); }
}
.fly{animation:flyRight 6s linear infinite}

/* EnKF cycle: rotating highlight around loop, translate-based (no rotation-direction ambiguity) */
@keyframes dashFlow{ to{ stroke-dashoffset:-200; } }
.flow-line{stroke-dasharray:6 6; animation:dashFlow 3s linear infinite}

.fadein{animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}

/* ---- module divider (section title) ---- */
.divider{width:100%;text-align:center}
.divider .modnum{display:inline-flex;width:64px;height:64px;border-radius:50%;background:var(--panel2);
  border:2px solid var(--accent);color:var(--accent);align-items:center;justify-content:center;
  font-size:26px;font-weight:800;margin-bottom:18px}
.divider .kicker{color:var(--accent2);font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.divider h1{font-size:44px;max-width:900px;margin:0 auto 16px}
.divider .sub{font-size:17px;color:var(--ink-dim);max-width:760px;margin:0 auto}
.modmap{display:flex;justify-content:center;gap:8px;margin-top:28px;flex-wrap:wrap}
.modmap span{padding:5px 12px;border-radius:999px;font-size:12px;background:var(--panel);
  border:1px solid var(--line);color:var(--ink-dim)}
.modmap span.cur{background:rgba(79,209,197,.15);color:var(--accent);border-color:var(--accent);font-weight:700}

/* ---- equation / formula display ---- */
.eqn-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 26px;margin:14px 0}
.eqn-box .eqn{font-family:Cambria,"Times New Roman",serif;font-size:22px;color:var(--accent2);font-weight:700;text-align:center}
.eqn-box .eqn-note{font-size:12.5px;color:var(--ink-dim);margin-top:10px;text-align:center;line-height:1.5}
.eqn-inline{font-family:Cambria,"Times New Roman",serif;color:var(--accent2);font-weight:700}

/* ---- worked example ---- */
.example-box{background:var(--panel2);border:1px dashed var(--accent);border-radius:14px;padding:18px 22px}
.example-box .tag-ex{display:inline-block;background:rgba(79,209,197,.15);color:var(--accent);border:1px solid rgba(79,209,197,.4);
  border-radius:7px;padding:2px 10px;font-size:11.5px;font-weight:700;letter-spacing:.05em;margin-bottom:10px}
.example-box .step{font-size:14.5px;line-height:1.7;color:var(--ink);margin-bottom:4px}
.example-box .step b{color:var(--accent2)}

/* ---- pitfall / common mistake ---- */
.pitfall{background:rgba(255,122,122,.08);border:1px solid rgba(255,122,122,.35);border-radius:14px;padding:18px 22px}
.pitfall .tag-warn{display:inline-block;background:rgba(255,122,122,.15);color:var(--danger);border:1px solid rgba(255,122,122,.4);
  border-radius:7px;padding:2px 10px;font-size:11.5px;font-weight:700;letter-spacing:.05em;margin-bottom:10px}

/* ---- self-check / checkpoint ---- */
.checkpoint{background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:18px 22px;margin-bottom:12px}
.checkpoint .q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px}
.checkpoint .a{font-size:13.5px;color:var(--accent);line-height:1.6}
.checkpoint .a::before{content:"→ "; color:var(--accent2)}

/* ---- summary recap list ---- */
.recap-item{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 16px;margin-bottom:8px}
.recap-item .ico{flex:0 0 auto;font-size:18px}
.recap-item .txt{font-size:14px;color:var(--ink-dim);line-height:1.55}
.recap-item .txt b{color:var(--ink)}
</style>

<script>
/* ============ SLIDE CONTENT ============ */
const SLIDES = [];
function slide(html){ SLIDES.push(html); }
function wrap(inner, cite){
  return '<div class="slide-inner">' + inner + '</div>' +
    (cite ? '<div class="footcite">Source: ' + cite + '</div>' : '');
}


slide(`
<div class="slide-inner cover center fadein">
  <div class="kicker">A knowledge deck — not a school-introduction deck</div>
  <h1>Satellite Altimetry for Continental Water Monitoring</h1>
  <p class="sub">6 modules — each: definition → equation → worked example → diagram → real data product → common pitfall → self-check → summary.</p>
  <div class="modmap"><span>1 · Nadir Altimetry</span><span>2 · SWOT / KaRIn</span><span>3 · Hydroweb-next</span><span>4 · Discharge (Q)</span><span>5 · Data Assimilation</span><span>6 · Flood & Transboundary</span></div>
</div>
`);

slide(wrap(`
<div class="slide-inner divider fadein"><div class="modnum">1</div><div class="kicker">VSEO6 Foundational Knowledge</div><h1>Nadir (Radar) Altimetry</h1><p class="sub">The classic vertical-radar altimetry technique — the foundation every later satellite height measurement builds on.</p><div class="modmap"><span class="cur">1 · Nadir Altimetry</span><span class="">2 · SWOT / KaRIn</span><span class="">3 · Hydroweb-next</span><span class="">4 · Discharge (Q)</span><span class="">5 · Data Assimilation</span><span class="">6 · Flood & Transboundary</span></div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Definition: measuring distance from a radar pulse's travel time</h1>
<div class="grid2">
  <ul class="bullets">
    <li>The satellite carries a <b>radar altimeter</b> that fires a pulse straight down along <b>nadir</b> (the point directly beneath the satellite)</li>
    <li>The pulse reflects off the water/land surface; the antenna receives the return signal</li>
    <li>It measures the pulse's <b>round-trip time</b> Δt → this gives the satellite-to-surface range R</li>
    <li>Combine R with the satellite's orbital altitude (known precisely from orbit-determination systems) → surface height h</li>
  </ul>
  <div class="diagram">
    <svg viewBox="0 0 300 220" width="100%">
      <rect x="0" y="190" width="300" height="30" fill="#0c1830"/>
      <rect x="120" y="20" width="60" height="24" rx="4" fill="#1b2c52" stroke="var(--nadir)"/>
      <text x="150" y="36" text-anchor="middle" class="lbl" font-size="11">satellite</text>
      <line x1="150" y1="44" x2="150" y2="170" stroke="var(--nadir)" stroke-width="2" stroke-dasharray="3 4" class="pulse-down"/>
      <line x1="150" y1="170" x2="150" y2="44" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 4" class="pulse-up"/>
      <text x="160" y="110" class="lbl-dim" font-size="11">R</text>
      <text x="150" y="205" text-anchor="middle" class="lbl-dim" font-size="11">water surface</text>
    </svg>
    <p class="center" style="font-size:12px;color:var(--ink-dim);margin-top:6px">The radar pulse travels down then reflects back — the time Δt is proportional to 2×R</p>
  </div>
</div>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>The range equation</h1>
<div class="eqn-box"><div class="eqn">R = c · &Delta;t / 2</div><div class="eqn-note">c: speed of light (3×10⁸ m/s) · Δt: round-trip time measured by the altimeter</div></div>
<ul class="bullets"><li>Divided by 2 because the pulse travels <b>down then back up</b> — Δt is the total time for both legs</li><li>Δt is on the order of a few milliseconds (altimeters fly at ~800–1300 km altitude)</li><li>The R measured here is a <b>raw distance</b> — not yet the water surface height; one more step is needed</li><li>Precision requirement: to reach cm-level accuracy in h, Δt must be measured to <b>picosecond</b> precision (10⁻¹² s, since c is so large) — this is why the altimeter's clock/oscillator must be extremely stable</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>From range R to water surface height h</h1>
<div class="eqn-box"><div class="eqn">h = H<sub>sat</sub> &minus; (R + &Sigma; corrections)</div><div class="eqn-note">H_sat: the satellite's orbital altitude above the reference ellipsoid — known to cm accuracy via precise orbit determination (POD)</div></div>
<ul class="bullets"><li>H_sat isn't measured by the altimeter itself — it comes from a separate orbit-determination system (GPS/DORIS onboard + ground stations)</li><li>R must first have <b>geophysical corrections</b> added (atmosphere, tides...) before subtraction — next slide</li><li>The final h is height above the <b>ellipsoid</b> — not the true mean sea level (see the geoid slide later in Module 1)</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Retracking — why not use the raw signal timing directly</h1>
<ul class="bullets"><li>The reflected pulse produces a <b>waveform</b> over time, not a single instant</li><li>The onboard tracker only locks on approximately — ground processing must re-derive exactly when the pulse <i>touched the surface</i></li><li><b>Retracking</b>: fitting a mathematical model to the measured waveform to recover a more accurate timing reference point</li><li>Over the wide, flat ocean: the waveform is close to standard (Brown model). Over narrow rivers/lakes: the waveform is distorted by banks and vegetation — a specialized retracker is needed</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Two retrackers for two kinds of surface</h1>
<div class="grid2">
  <div class="card"><h3>Brown model (ocean)</h3><p>Assumes a statistically flat sea surface with a Gaussian wave-height distribution — producing a "standard" smooth single-peak waveform. Suited to wide, homogeneous water surfaces.</p></div>
  <div class="card"><h3>OCOG / threshold retracker (inland water)</h3><p>Makes no assumption about waveform shape — finds the energy centroid (OCOG) or a percentage-of-peak threshold. Tolerates noisy, multi-peak waveforms from riverbanks/vegetation.</p></div>
</div>
<div class="pitfall"><span class="tag-warn">Common mistake</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">Using the standard ocean retracker (Brown) on rivers narrower than 1km produces systematically biased results — because its underlying assumption (a wide flat surface) doesn't match river geometry.</p></div>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Worked example: from Δt to R</h1>
<div class="example-box"><span class="tag-ex">Example 1</span><div class="step">Given: the altimeter measures Δt = 5.34 ms = 5.34×10⁻³ s</div><div class="step">Apply: <b>R = c·Δt/2</b> = (3×10⁸ m/s × 5.34×10⁻³ s) / 2</div><div class="step">= (1,602,000 m) / 2 = <b>801,000 m ≈ 801 km</b></div><div class="step">If H_sat (orbit) = 803 km and total corrections ≈ +0.3 m: h = 803,000 − (801,000 + 0.3) ≈ <b>1,999.7 m</b> above the ellipsoid</div></div>
<div class="example-box"><span class="tag-ex">Example 2 — a sanity check</span><div class="step">Given: same satellite (H_sat = 803 km), but the lake level has risen 1 m compared with Example 1 (new h = 2,000.7 m)</div><div class="step">R must decrease by exactly 1 m accordingly: R = 803,000 − 2,000.7 − 0.3 = <b>800,999 m</b></div><div class="step">→ New Δt = 2R/c = (2 × 800,999)/(3×10⁸) ≈ <b>5.33999 ms</b> — only ~6.7 nanoseconds different from Example 1 for 1 m of water rise</div><div class="step">Check: consistent with the previous slide (picosecond precision needed for cm resolution) — here 1 m of rise corresponds to ~6,700 picoseconds, easily measurable</div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Waveform shape: what the reflected signal tells you</h1>
<div class="diagram">
  <svg viewBox="0 0 360 140" width="100%">
    <polyline points="10,120 60,118 100,60 130,30 160,45 200,75 260,95 340,105" fill="none" stroke="var(--nadir)" stroke-width="2.5"/>
    <text x="100" y="20" class="lbl-dim" font-size="10">Ocean (Brown): one peak, smooth slopes</text>
  </svg>
</div>
<ul class="bullets"><li>Horizontal axis: time (~distance) · Vertical axis: returned reflected energy</li><li>Ocean waveform: rises steeply then decays smoothly — the Brown model fits well, the half-power point is clearly defined</li><li>Narrow river/lake waveform: multiple jagged peaks from bank reflections + vegetation interspersed with flat water — needs the OCOG/threshold retracker (previous slide) instead of the Brown model</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Error budget summary — precision budget</h1>
<table style="width:100%;border-collapse:collapse;font-size:13.5px">
  <tr style="color:var(--accent2)"><td style="padding:8px 6px"><b>Error source</b></td><td style="padding:8px 6px"><b>Typical magnitude</b></td><td style="padding:8px 6px"><b>Character</b></td></tr>
  <tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px">Dry troposphere</td><td style="padding:8px 6px;color:var(--ink-dim)">~2.3 m</td><td style="padding:8px 6px;color:var(--ink-dim)">Stable, models well</td></tr>
  <tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px">Wet troposphere</td><td style="padding:8px 6px;color:var(--ink-dim)">A few cm–dm</td><td style="padding:8px 6px;color:var(--ink-dim)">Fast-changing, hardest</td></tr>
  <tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px">Ionosphere</td><td style="padding:8px 6px;color:var(--ink-dim)">2–8 cm</td><td style="padding:8px 6px;color:var(--ink-dim)">Corrected via dual-frequency</td></tr>
  <tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px">Orbit error (POD)</td><td style="padding:8px 6px;color:var(--ink-dim)">~cm-scale</td><td style="padding:8px 6px;color:var(--ink-dim)">Improved greatly from TOPEX-era (dm) down to Jason/Sentinel (cm)</td></tr>
  <tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px">Retracking (river/lake)</td><td style="padding:8px 6px;color:var(--ink-dim)">A few cm–dm</td><td style="padding:8px 6px;color:var(--ink-dim)">Depends on river width, bank vegetation</td></tr>
</table>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Dual-frequency measurement: why two bands at once</h1>
<div class="eqn-box"><div class="eqn">R<sub>free</sub> = (f<sub>Ku</sub>² · R<sub>Ku</sub> &minus; f<sub>C</sub>² · R<sub>C</sub>) / (f<sub>Ku</sub>² &minus; f<sub>C</sub>²)</div><div class="eqn-note">"Ionosphere-free" combination: R_Ku, R_C are the ranges measured at each frequency — the frequency-squared-weighted subtraction cancels the ionospheric delay</div></div>
<ul class="bullets"><li>Most altimeters carry <b>two frequencies</b> simultaneously — e.g. Ku-band (~13.6 GHz) and C-band (~5.3 GHz) on the Jason/Sentinel-6 series</li><li>The ionospheric delay depends on the <b>inverse square of frequency</b> — measuring both at once lets you solve two equations, separating the frequency-dependent ionospheric delay from the true range</li><li>Without dual-frequency, one must fall back on a global ionosphere model (less accurate than direct measurement) — this is why two frequencies are near-mandatory for high-precision altimeters</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Three mandatory geophysical corrections before computing h</h1>
<div class="grid3">
  <div class="card"><h3>Dry troposphere</h3><p>~2.3 m, computed directly from surface atmospheric pressure at the measurement point — <b>stable, models well</b>, very small residual error.</p></div>
  <div class="card"><h3>Wet troposphere</h3><p>A few cm–decimeters, depends on atmospheric <b>water vapour</b> — changes quickly with weather, the <b>hardest and most uncertain</b> correction.</p></div>
  <div class="card"><h3>Ionosphere</h3><p>2–8 cm, depends on radar frequency — measured by <b>combining two bands</b> (e.g. Ku + C/S) to separate the frequency-dependent part of the signal.</p></div>
</div>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Ground track: why spatial coverage is so sparse</h1>
<div class="grid2">

<ul class="bullets"><li><b>TOPEX/Poseidon</b> (1992) → <b>Jason-1/2/3</b> → <b>Sentinel-6 Michael Freilich</b>: one satellite lineage on the same reference orbit, keeping a continuous record for over 30 years</li><li><b>Sentinel-3A/3B</b> (Copernicus): altimeters operating in parallel, different orbit, increasing crossover density</li><li>A long record reveals <b>long-term trends</b> (climate change, decade-scale reservoir decline) that a single SWOT measurement (only since 2022) cannot show</li></ul>

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Vertical datum: ellipsoid vs geoid</h1>
<div class="eqn-box"><div class="eqn">H (orthometric height) = h<sub>ellipsoid</sub> &minus; N<sub>geoid</sub></div><div class="eqn-note">N_geoid: the geoid–ellipsoid separation at that location, looked up from a global model (e.g. EGM2008)</div></div>
<ul class="bullets"><li>The height h from the range equation is relative to the <b>ellipsoid</b> — a smooth mathematical surface (e.g. WGS84), not the true mean sea level</li><li><b>Geoid</b>: an equipotential gravity surface, approximating mean sea level if winds/currents are ignored — bumpier than the ellipsoid because it reflects Earth's real mass distribution</li><li>In-situ gauges usually report height relative to a local datum close to the geoid — <b>not directly comparable</b> to h_ellipsoid without conversion</li><li>The standard reference ellipsoid used by most altimeters/GPS is <b>WGS84</b>: semi-major axis a = 6,378,137 m, flattening f = 1/298.257223563 — a purely mathematical ellipsoid of revolution, independent of Earth's actual mass distribution</li></ul>
<div class="pitfall"><span class="tag-warn">Common mistake</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">Directly comparing satellite height (ellipsoid) with gauge data (local datum) without converting through the geoid — the discrepancy can be several meters, easily mistaken for 'satellite error'.</p></div>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Self-check</h1>
<div class="checkpoint"><div class="q">❓ Why does the range equation divide by 2?</div><div class="a">Because the radar pulse travels down THEN reflects back — the measured Δt is the total time for both legs, so R (one-way) = c·Δt/2.</div></div><div class="checkpoint"><div class="q">❓ How does the OCOG retracker differ from the Brown model?</div><div class="a">The Brown model assumes a smooth single-peak waveform from a wide ocean surface; OCOG/threshold makes no shape assumption and tolerates the noisy, multi-peak waveforms of narrow rivers/lakes.</div></div><div class="checkpoint"><div class="q">❓ Why does nadir altimetry have sparse spatial coverage but long time series?</div><div class="a">Because it only measures along one fixed narrow strip (few crossovers with rivers/lakes), but the orbit repeats reliably over decades at exactly those points.</div></div><div class="checkpoint"><div class="q">❓ What error does the dual-frequency (Ku/C-band) combination cancel, and why the f² weighting?</div><div class="a">It cancels ionospheric error — since ionospheric delay is inversely proportional to f², subtracting with f²-weighted terms (f²·R_Ku and f²·R_C) lets you solve two equations for two unknowns (true range + frequency-dependent delay), isolating the frequency-dependent part from the true range.</div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 2 · SWOT</div>
<h1>Why wide-swath is needed — recalling Module 1's limits</h1>
<ul class="bullets"><li>Nadir altimetry: one narrow strip, data only at fixed crossovers — <b>the full shape of the water surface is invisible</b></li><li>Cannot measure the <b>water-surface slope</b> along a river (needed to estimate discharge — see Module 4)</li><li>Cannot detect changes in river geometry (widening/narrowing with the flood season) except exactly at a crossover</li><li>→ A sensor that scans the <b>entire water area</b>, not just one line, is needed</li></ul>

slide(wrap(`
<div class="eyebrow">Module 2 · SWOT</div>
<h1>KaRIn hardware: two antennas, one 10 m boom</h1>
<ul class="bullets"><li><b>Ka-band Radar Interferometer</b>: two identical radar antennas, mounted at either end of a rigid <b>10-metre</b> boom</li><li>Both antennas transmit/receive signal from the same ground point, but from two slightly different positions</li><li>The distance between the two antennas is called the <b>baseline B</b> = 10 m — a fixed, precisely known geometric parameter</li><li>Operates at Ka-band (~35.75 GHz) — a short wavelength enabling high spatial resolution</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 2 · SWOT</div>
<h1>Interferometry principle: measuring phase, not time</h1>
<ul class="bullets"><li>Unlike nadir altimetry (which measures Δt directly) — KaRIn measures the <b>phase difference Δφ</b> between the signals received at the two antennas</li><li>Because the two antennas sit at different positions, the round-trip signal path differs slightly → producing a phase difference</li><li>This phase difference encodes the <b>look angle θ</b> to the measurement point — from θ, height is derived</li><li>This technique is borrowed from InSAR (Interferometric SAR), used in ground-deformation measurement, applied here for the first time to water-surface height at global scale</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 2 · SWOT</div>
<h1>Phase → look angle → height</h1>
<div class="eqn-box"><div class="eqn">&Delta;&phi; = k · B · sin(&theta;)</div><div class="eqn-note">k = 2π/λ (wavenumber, λ: Ka-band wavelength) · B: 10 m baseline · θ: look angle</div></div>
<div class="eqn-box"><div class="eqn">h = H &minus; r<sub>1</sub> · cos(&theta;)</div><div class="eqn-note">H: satellite altitude · r₁: distance from antenna 1 to the measurement point</div></div>
<ul class="bullets"><li>Step 1: measure Δφ directly from the two receive channels → solve the first equation for θ</li><li>Step 2: substitute θ into the second equation, together with r₁ (measured via travel time as in nadir altimetry) → get h</li></ul>
`, 'KaRIn — Measurement principle, processing and data specificities'));

slide(wrap(`
<div class="eyebrow">Module 2 · SWOT</div>
<h1>Phase ambiguity — why "unwrapping" is needed</h1>
<div class="eqn-box"><div class="eqn">E<sub>a</sub> &asymp; &lambda; · r<sub>1</sub> · sin(&theta;) / B</div><div class="eqn-note">E_a: altitude of ambiguity (the height difference corresponding to one 2π cycle in phase) · λ, r₁, θ, B as in previous slides</div></div>
<ul class="bullets"><li>Phase is only measured <b>modulo 2π</b> — the instrument cannot distinguish Δφ from Δφ + 2π, Δφ + 4π, ...</li><li>A 2π difference in phase corresponds to a fixed height difference called the <b>altitude of ambiguity E_a</b> — a longer baseline B gives a smaller E_a (more sensitive, but more prone to ambiguity)</li><li>Ground processing must perform <b>phase unwrapping</b> — using spatial neighborhood information to pick the correct "2π cycle"</li><li>This is a complex processing step, prone to errors over rugged terrain or water surfaces interrupted by vegetation/islands</li></ul>
`));

slide(wrap(`

<h1>Worked example: from Δφ to θ (simplified)</h1>
<div class="example-box"><span class="tag-ex">Example 1 (illustrative, simplified figures)</span><div class="step">Given: Ka-band wavelength λ ≈ 0.0084 m (frequency ~35.75 GHz) → k = 2π/λ ≈ 748 rad/m</div><div class="step">Given: baseline B = 10 m, measured Δφ = 0.6 rad</div><div class="step">Apply: <b>sin(θ) = Δφ / (k·B)</b> = 0.6 / (748 × 10) ≈ 0.0000802</div><div class="step">→ θ ≈ 0.0046° — a tiny angle, because the very short Ka-band wavelength makes the measurement extremely sensitive to small phase differences</div><div class="step">This is why measuring phase to milliradian precision is essential to reach cm–dm height accuracy</div></div>

`));

slide(wrap(`
<div class="eyebrow">Module 2 · SWOT</div>
<h1>Resolution trade-off: near-range vs far-range</h1>
<ul class="bullets"><li>Cross-track (across-swath) resolution is <b>not uniform</b>: finer near the nadir side (near-range, ~5-10m), coarser at the far edge (far-range, up to ~60-70m)</li><li>Geometric cause: the incidence angle increases progressively from near to far range, reducing cross-track ranging sensitivity</li><li>Practical consequence: a narrow river at the far edge of the swath is measured less accurately than the same river closer to the swath — worth noting when comparing data quality across different overpasses</li></ul>
`));

`));

`));

<div class="slide-inner divider fadein"><div class="modnum">4</div><div class="kicker">VSEO6 Foundational Knowledge</div><h1>River Discharge Estimation</h1><p class="sub">From three satellite-measured quantities (W, h, S) to the Q number water managers actually need.</p><div class="modmap"><span class="">1 · Nadir Altimetry</span><span class="">2 · SWOT / KaRIn</span><span class="">3 · Hydroweb-next</span><span class="cur">4 · Discharge (Q)</span><span class="">5 · Data Assimilation</span><span class="">6 · Flood & Transboundary</span></div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>What discharge Q is, and why it's the most important quantity</h1>
<ul class="bullets"><li><b>Discharge</b> Q: the volume of water flowing through a river cross-section per unit time, in m³/s</li><li>This is the quantity water agencies, flood forecasters, and reservoir operators <b>actually need</b> — not the water-surface height itself</li><li>Traditional in-situ gauges measure Q via a <b>rating curve</b>: an empirical relationship between gauge water level and directly measured Q (labor-intensive, requiring many repeated measurements over time to build the curve)</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Why satellites can't measure Q directly — recalling Modules 1 & 2</h1>
<ul class="bullets"><li>Nadir altimetry (Module 1) only gives <b>height at a point</b> — getting Q needs a rating curve built from in-situ data, i.e. still dependent on a physical gauge</li><li>SWOT/KaRIn (Module 2) gives <b>height h, slope S, width W</b> along the whole reach — more than nadir, but still <b>not Q itself</b></li><li>→ A <b>hydraulic model</b> is needed to convert (W, h, S) into Q without directly measuring flow velocity — this is the core content of Module 4</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>The continuity equation: Q = A·V</h1>
<div class="eqn-box"><div class="eqn">Q = A · V</div><div class="eqn-note">A: wetted cross-sectional area (m²) · V: mean flow velocity (m/s)</div></div>
<ul class="bullets"><li>This is discharge's most basic definition — volume/second equals cross-sectional area times the mean velocity through it</li><li>The problem: satellites cannot measure <b>A</b> (needs knowing the riverbed shape, hidden under water) nor <b>V</b> directly</li><li>A second equation is needed, linking V to <b>observable</b> quantities (W, h, S) — that's the Manning equation</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>The Manning equation: linking velocity to slope</h1>
<div class="eqn-box"><div class="eqn">V = (1/n) · R<sub>h</sub><sup>2/3</sup> · S<sup>1/2</sup></div><div class="eqn-note">n: Manning's roughness coefficient (depends on bed/bank material) · R_h: hydraulic radius ≈ A/wetted perimeter · S: water-surface slope</div></div>
<ul class="bullets"><li>A classic empirical open-channel hydraulics equation, published by engineer Robert Manning in 1889, still used today for rivers/channels</li><li><b>S</b> (water-surface slope along the river) is exactly the quantity SWOT measures directly (Module 2) — this is why SWOT is especially valuable for this problem</li><li>For a wide river, <b>R_h</b> is roughly equal to mean depth — but must still be related to the observable W, h</li><li>Typical n values from hydraulics references: clean natural earth channels ~0.025–0.033, rivers with rocks/bank vegetation ~0.035–0.05, concrete channels ~0.013–0.017 — illustrating a wide range that makes assuming a fixed n risky</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>The core problem: A and n are unknowns, unobservable</h1>
<div class="pitfall"><span class="tag-warn">Two key unknowns</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">The wetted cross-sectional area A depends on riverbed shape (bathymetry) — a satellite cannot see through water to measure it. The roughness coefficient n depends on bed/bank material and vegetation — also not reliably measured directly from satellite imagery. Both must be INFERRED from the W-h-S time series that SWOT provides.</p></div>
<ul class="bullets"><li>The shared idea behind every SWOT discharge algorithm: use repeated (W, h, S) observations over time at the same river reach to <b>constrain</b> the hidden A and n values, assuming they are stable or vary in a predictable way</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Classical hydraulic geometry — the foundation of the AMHG idea</h1>
<div class="eqn-box"><div class="eqn">W = a·Q<sup>b</sup>,&nbsp; D = c·Q<sup>f</sup>,&nbsp; V = k·Q<sup>m</sup></div><div class="eqn-note">Leopold & Maddock (1953): width W, depth D, velocity V vary as power laws of Q at a fixed cross-section (at-a-station)</div></div>
<ul class="bullets"><li>This relationship is observed empirically to be fairly stable at a given river cross-section across different discharge levels</li><li>The AMHG extension: if this relationship is known (or inferable) at multiple cross-sections along a river, width measurements from SWOT can be used to back out Q without directly measuring A or V</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>AMHG — At-Many-stations Hydraulic Geometry</h1>
<ul class="bullets"><li>Core idea: at <b>neighboring cross-sections</b> along the same reach with no major tributaries in/out, discharge Q must be <b>approximately equal</b> at the same point in time (mass conservation)</li><li>The "equal Q between neighboring cross-sections" constraint <b>halves the number of parameters</b> to estimate — instead of solving each cross-section independently, the whole reach is solved jointly</li><li>Known limitation: accuracy is low if the at-a-station hydraulic geometry (AHG) parameters deviate substantially from the theoretical assumption</li></ul>
`, 'Hagemann et al. 2017, BAM — Water Resources Research'));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>BAM — Bayesian AMHG-Manning: combining both approaches</h1>
<ul class="bullets"><li><b>BAM</b> (Bayesian AMHG-Manning): combines the AMHG constraint (previous slide) with the Manning equation within a <b>Bayesian</b> inference framework</li><li>Instead of a single Q value, BAM estimates a <b>probability distribution</b> for Q — properly reflecting the problem's inherent uncertainty (many different A, n combinations can produce the same observed W-h-S)</li><li>Tested on 19 real rivers, BAM shows improved accuracy over using AMHG or classical Manning alone</li></ul>
`, 'Hagemann et al. 2017, WRR'));

      <text x="195" y="79" text-anchor="middle" class="lbl-accent">AMHG-Manning</text>
      <path d="M240,68 L300,68" stroke="var(--accent2)" stroke-width="2" marker-end="url(#arrow2)"/>
      <rect x="245" y="52" width="90" height="32" rx="8" fill="rgba(242,184,75,.15)" stroke="var(--accent2)"/>
      <text x="290" y="72" text-anchor="middle" class="lbl-accent" style="fill:var(--accent2)">Discharge Q</text>
    </g>
    <defs><marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--accent2)"/></marker></defs>
  </svg>
</div>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>MetroMan & MFG — two other algorithm families from the SWOT science team</h1>
<ul class="bullets"><li><b>MetroMan</b> (Metropolis Manning): uses Markov Chain Monte Carlo (Metropolis-Hastings) to jointly infer the hidden Manning parameters from the W-h-S time series — Bayesian in spirit like BAM, but a different sampling technique</li><li><b>MFG</b> (Mean Flow and Geomorphology): leverages additional long-term average river-morphology information (from historical optical imagery) as an extra constraint, reducing reliance on SWOT data alone</li><li>The SWOT hydrology science team runs <b>several algorithms in parallel</b> (BAM, MetroMan, MFG, pure AMHG...) and compares/combines them — there is no single "universally correct" algorithm for every river type</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Comparing two approaches to estimating Q</h1>
<table style="width:100%;border-collapse:collapse;font-size:13.5px">
  <tr style="color:var(--accent2)"><td style="padding:8px 6px"><b>Criterion</b></td><td style="padding:8px 6px"><b>Rating curve (gauge, Module 1)</b></td><td style="padding:8px 6px"><b>BAM/AMHG (SWOT, Module 4)</b></td></tr>
  <tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px">Needs direct Q measurement first?</td><td style="padding:8px 6px;color:var(--ink-dim)">Yes — to build the curve</td><td style="padding:8px 6px;color:var(--ink-dim)">Not required</td></tr>
  <tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px">Coverage</td><td style="padding:8px 6px;color:var(--ink-dim)">Only at the exact gauge location</td><td style="padding:8px 6px;color:var(--ink-dim)">The entire reach within the swath</td></tr>
  <tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px">Typical accuracy</td><td style="padding:8px 6px;color:var(--ink-dim)">High (5-10%) if the curve is good</td><td style="padding:8px 6px;color:var(--ink-dim)">Lower (tens of %)</td></tr>
  <tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px">Works on ungauged rivers?</td><td style="padding:8px 6px;color:var(--ink-dim)">Not possible</td><td style="padding:8px 6px;color:var(--ink-dim)">Yes — its core value</td></tr>
</table>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Reliability grows with the number of observations</h1>
<ul class="bullets"><li>A single (W, h, S) observation gives a very wide Q estimate range — too many different (A, n) combinations could match it</li><li>As more overpasses accumulate (more of SWOT's 21-day cycles), the uncertainty range on the hidden parameters (A, n) <b>narrows progressively</b> — this is why Bayesian algorithms (BAM, MetroMan) are designed to process the <b>entire time series at once</b>, not a single observation</li><li>Practical consequence: Q estimates made right after SWOT's launch (short data record) are much less reliable than estimates made after several years of accumulated observations at the same reach</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Worked example: estimating Q using Manning</h1>
<div class="example-box"><span class="tag-ex">Example 1 (illustrative, simplified figures)</span><div class="step">Given: a reach with W = 150 m, estimated mean depth D ≈ 3 m, water-surface slope S = 0.0001 (measured by SWOT), assumed roughness n = 0.03 (natural sand/gravel bed)</div><div class="step">Compute R_h ≈ D = 3 m (a reasonable approximation since the river is much wider than it is deep)</div><div class="step">Apply Manning: <b>V = (1/0.03) × 3^(2/3) × 0.0001^(1/2)</b> ≈ 33.3 × 2.08 × 0.01 ≈ <b>0.69 m/s</b></div><div class="step">Estimated cross-sectional area A ≈ W × D = 150 × 3 = 450 m²</div><div class="step"><b>Q = A × V ≈ 450 × 0.69 ≈ 310 m³/s</b></div></div>
<div class="example-box"><span class="tag-ex">Example 2 — same river, vegetation season (n doubles)</span><div class="step">Same reach, same W=150m, D=3m, S=0.0001 — but in summer, riverbank vegetation grows dense, and the true n rises to 0.06 (double Example 1)</div><div class="step">V = (1/0.06) × 3^(2/3) × 0.0001^(1/2) ≈ 16.7 × 2.08 × 0.01 ≈ <b>0.35 m/s</b> (half of Example 1)</div><div class="step">Q = 450 × 0.35 ≈ <b>156 m³/s</b> — nearly 50% lower than 310 m³/s even though W, D, S are unchanged</div><div class="step">→ A quantitative illustration of the next slide's pitfall: holding n fixed while it actually varies with season causes a very large systematic error (here, nearly a factor of 2) in the estimated Q</div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Uncertainty in satellite-based discharge estimates</h1>
<ul class="bullets"><li>Discharge estimates from satellite methods (BAM/MetroMan) typically carry errors of <b>tens of percent</b> relative to direct gauge measurement — much larger than the cm-dm error in height measurement itself</li><li>Main uncertainty sources: assuming a fixed roughness n, indirect error in estimating A via W-h, and the still-limited number of observations (SWOT's 21-day cycle)</li><li>For rivers with a <b>parallel in-situ gauge</b>, hidden parameters can be calibrated — accuracy improves substantially compared with a fully unreferenced estimate</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Validation: comparing satellite Q against gauge Q</h1>
<ul class="bullets"><li>A mandatory step before trusting results: compare the SWOT-estimated Q time series against directly measured Q at available gauges (where they still operate)</li><li>Common evaluation metrics: NSE (Nash-Sutcliffe Efficiency), relative RMSE, temporal correlation coefficient</li><li>A practical paradox: the very rivers that <b>need SWOT most</b> (ungauged, transboundary — see Module 6) are also the <b>hardest to validate</b>, for lack of independent reference data</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Common mistake — assuming a fixed roughness coefficient</h1>
<div class="pitfall"><span class="tag-warn">n is not actually constant across seasons/water levels</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">Manning's n changes in reality with season (riverbank vegetation growing/dying back), with water level (a lower level exposes more bed obstacles, increasing roughness), and with moving sediment. Treating n as a constant throughout a time series is a common systematic error source, especially in tropical rivers with strong seasonal variation like the Mekong basin.</p></div>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>The single most important application: ungauged rivers</h1>
<ul class="bullets"><li>Most of the practical value of Module 4's algorithms lies in <b>ungauged basins</b> or basins whose data isn't publicly shared</li><li>A prime example: the lower <b>Mekong</b> — many transboundary reaches lack coordinated gauging between countries (directly connects to Module 6)</li><li>For these rivers, Q estimation relies entirely on observed (W, h, S) plus reasonable geometric/roughness assumptions — there is no other way to get quantitative data</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Self-check</h1>
<div class="checkpoint"><div class="q">❓ Why are both the continuity equation Q=AV and the Manning equation needed?</div><div class="a">Because Q=AV has two unobservable unknowns (A, V); Manning provides a second equation linking V to S (measured by SWOT) and R_h, reducing the number of unknowns that must be inferred.</div></div><div class="checkpoint"><div class="q">❓ How does AMHG reduce the number of parameters to estimate?</div><div class="a">By constraining discharge Q to be approximately equal between neighboring cross-sections along the same reach (mass conservation), halving the number of hydraulic-geometry parameters to solve for.</div></div><div class="checkpoint"><div class="q">❓ Why is it hard to validate satellite Q exactly where it's needed most?</div><div class="a">Because ungauged or transboundary rivers with no shared data are precisely the places lacking the independent reference data needed to compare/verify satellite-based estimates.</div></div><div class="checkpoint"><div class="q">❓ In the worked example, why does Q drop by nearly half when n doubles, with W/D/S unchanged?</div><div class="a">Because in the Manning equation, V is directly inversely proportional to n (V=(1/n)·Rh^(2/3)·S^(1/2)) — doubling n halves V, and since Q=A·V with A unchanged, Q is also halved.</div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Summary</div>
<h1>Three core takeaways carried into later modules</h1>
<div class="recap-item"><span class="ico">🧮</span><span class="txt"><b>Q = A·V</b> and <b>V=(1/n)Rh^(2/3)S^(1/2)</b> — the two core equations; A and n are unknowns that must be inferred from the W-h-S time series SWOT (Module 2) provides.</span></div><div class="recap-item"><span class="ico">📊</span><span class="txt">BAM/AMHG are statistical (Bayesian) inference algorithms — the same philosophy as Data Assimilation in Module 5: combining a physical model with uncertain observations.</span></div><div class="recap-item"><span class="ico">🌏</span><span class="txt">The greatest value lies in <b>ungauged/transboundary rivers</b> — a direct bridge into the real-world application in Module 6 (Mekong).</span></div>
`));

slide(wrap(`
<div class="slide-inner divider fadein"><div class="modnum">5</div><div class="kicker">VSEO6 Foundational Knowledge</div><h1>Data Assimilation — Kalman Filter & EnKF</h1><p class="sub">Optimally combining a numerical model with satellite observations — the mathematical core behind every modern hydrological forecast.</p><div class="modmap"><span class="">1 · Nadir Altimetry</span><span class="">2 · SWOT / KaRIn</span><span class="">3 · Hydroweb-next</span><span class="">4 · Discharge (Q)</span><span class="cur">5 · Data Assimilation</span><span class="">6 · Flood & Transboundary</span></div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Definition: optimally combining model and observation</h1>
<ul class="bullets"><li><b>Data assimilation</b>: a mathematical technique combining (a) the output of a <b>numerical model</b> (a hydrological/hydraulic model forecasting flow) with (b) <b>real observations</b> (height/slope/width from Modules 1-2, discharge from Module 4)</li><li>The combination is <b>weighted by each source's uncertainty</b> — not a simple average</li><li>Result: a system-state estimate <b>more accurate</b> than either source alone</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Diagram: forecast → analysis → forecast cycle</h1>
<div class="diagram" style="max-width:460px;margin:0 auto">
  <svg viewBox="0 0 360 220" width="100%">
    <circle cx="180" cy="110" r="80" fill="none" stroke="var(--line)" stroke-width="1"/>
    <path class="flow-line" d="M180,30 A80,80 0 1 1 179,30" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <rect x="140" y="10" width="80" height="34" rx="8" fill="var(--panel2)" stroke="var(--nadir)"/>
    <text x="180" y="32" text-anchor="middle" class="lbl" font-size="12">Forecast (model)</text>
    <rect x="250" y="93" width="90" height="34" rx="8" fill="var(--panel2)" stroke="var(--swot)"/>
    <text x="295" y="115" text-anchor="middle" class="lbl" font-size="11">+ Observation y</text>
    <rect x="140" y="176" width="80" height="34" rx="8" fill="rgba(79,209,197,.15)" stroke="var(--accent)"/>
    <text x="180" y="198" text-anchor="middle" class="lbl-accent" font-size="12">Analysis</text>
    <rect x="20" y="93" width="90" height="34" rx="8" fill="var(--panel2)" stroke="var(--line)"/>
    <text x="65" y="115" text-anchor="middle" class="lbl" font-size="11">Continue the model</text>
  </svg>
  <p class="center" style="font-size:11.5px;color:var(--ink-dim);margin-top:4px">A continuous loop: every time a new observation arrives, the model is "corrected" before forecasting further</p>
</div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>The state vector z — the system state being estimated</h1>
<ul class="bullets"><li><b>State vector z</b>: the collection of all variables describing the hydrological system's state at a given time — e.g. water level at every Node along a river (Module 3), discharge at every Reach, soil moisture in the hydrological model</li><li>For a large basin, z can have <b>thousands to millions of components</b> — the very source of the computational challenge that motivates EnKF (next slides)</li><li>The goal of data assimilation: estimate z as accurately as possible at every time step, using both model and observation</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>The Kalman Filter — its foundational assumptions</h1>
<ul class="bullets"><li>Assumes the model is <b>linear</b> (or nearly so) and errors follow a <b>Gaussian distribution</b></li><li>Under this assumption, the optimal combination (in the minimum-variance sense) of forecast and observation has a <b>closed-form solution</b> — no trial and error, the optimal result is computed directly</li><li>This is why the Kalman Filter became the standard tool in missile guidance, satellite navigation, and later climate/hydrology science</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>The analysis-step equation</h1>
<div class="eqn-box"><div class="eqn">z<sup>a</sup> = z<sup>f</sup> + K(y &minus; H·z<sup>f</sup>)</div><div class="eqn-note">z^f: forecast state · y: observation (e.g. water level from altimetry) · H: observation operator · z^a: state after analysis</div></div>
<ul class="bullets"><li><b>H</b> (observation operator): "translates" the model state into a space directly comparable with the observation — e.g. if z is height at a Node but y is measured at a different location, H performs spatial interpolation</li><li><b>(y − H·z^f)</b> is called the <b>innovation</b> — the difference between real observation and model forecast, exactly the "new information" the observation brings</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>The Kalman gain K</h1>
<div class="eqn-box"><div class="eqn">K = P·H<sup>T</sup> (H·P·H<sup>T</sup> + R)<sup>&minus;1</sup></div><div class="eqn-note">P: forecast error covariance (model uncertainty) · R: observation error covariance</div></div>
<ul class="bullets"><li>K determines <b>what percentage</b> of the innovation is applied to the state update</li><li>If the model is very uncertain (large P) relative to a reliable observation (small R) → K is large → the analysis leans strongly toward the observation</li><li>If the reverse holds (the model is more trustworthy than the observation) → K is small → the analysis stays close to the model forecast</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Worked example: computing K for a scalar variable</h1>
<div class="example-box"><span class="tag-ex">Example 1 — observation more trustworthy than the model</span><div class="step">Given: the model forecasts water level z^f = 5.0 m, with uncertainty (variance) P = 0.25 m² (standard deviation 0.5m)</div><div class="step">SWOT observation: y = 5.3 m, with observation uncertainty R = 0.01 m² (standard deviation 0.1m, fairly reliable)</div><div class="step">Assume H = 1 (direct observation of the same variable): <b>K = P/(P+R)</b> = 0.25/(0.25+0.01) ≈ <b>0.962</b></div><div class="step">z^a = z^f + K(y − z^f) = 5.0 + 0.962×(5.3−5.0) = 5.0 + 0.289 ≈ <b>5.29 m</b></div><div class="step">K is close to 1 because the observation is far more reliable than the model — the analysis lands very close to y</div></div>
<div class="example-box"><span class="tag-ex">Example 2 — reversed: the model is more trustworthy than the observation</span><div class="step">Same z^f = 5.0 m, y = 5.3 m — but this time the model is very good (P = 0.01 m²) while the observation is partly cloud-contaminated (R = 0.25 m²)</div><div class="step">K = P/(P+R) = 0.01/(0.01+0.25) ≈ <b>0.038</b></div><div class="step">z^a = 5.0 + 0.038×(5.3−5.0) = 5.0 + 0.011 ≈ <b>5.01 m</b></div><div class="step">K is close to 0 because the observation is unreliable — the analysis nearly retains the model forecast, largely ignoring the noisy observation</div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>The standard Kalman Filter's limit for large problems</h1>
<div class="pitfall"><span class="tag-warn">P cannot be computed explicitly at large scale</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">For a basin whose z contains thousands/millions of components (state-vector slide), the covariance matrix P has size (number of components)² — far too large to store and update directly with ordinary memory/computation.</p></div>
<ul class="bullets"><li>→ A way to <b>approximate P</b> without computing the full matrix explicitly is needed — this is exactly what motivates the Ensemble Kalman Filter</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>The Ensemble Kalman Filter (EnKF) — the core idea</h1>
<ul class="bullets"><li>Instead of computing P explicitly, run <b>N parallel model copies</b> (an ensemble), each with slightly different initial perturbations/parameters</li><li>The spread among the N ensemble members at a given time is exactly a <b>sample-covariance</b> estimate — replacing P without any closed-form formula</li><li>N is typically tens to a few hundred — far smaller than P's full size, yet enough to capture the most important uncertainty structure</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>The EnKF equations: forecast & analysis</h1>
<div class="eqn-box"><div class="eqn">z<sub>i</sub><sup>f</sup> = M(z<sub>i</sub>), &nbsp; i = 1…N</div><div class="eqn-note">Forecast step: each ensemble member runs independently through the dynamical model M</div></div>
<div class="eqn-box"><div class="eqn">K<sub>j</sub> = Ĉ<sub>j</sub>·H<sub>j</sub><sup>T</sup> (H<sub>j</sub>·Ĉ<sub>j</sub>·H<sub>j</sub><sup>T</sup> + &Gamma;<sub>j</sub>)<sup>&minus;1</sup></div><div class="eqn-note">Analysis step: Ĉ_j is the SAMPLE covariance from the forecast ensemble (replacing P) · Γ_j: observation error covariance</div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Ensemble diagram: N members running in parallel</h1>
<div class="diagram" style="max-width:560px;margin:0 auto">
  <svg viewBox="0 0 440 160" width="100%">
    <g font-size="11">
      <line x1="20" y1="30" x2="320" y2="30" stroke="var(--nadir)" stroke-width="1.5" opacity=".7"/>
      <line x1="20" y1="60" x2="320" y2="70" stroke="var(--nadir)" stroke-width="1.5" opacity=".7"/>
      <line x1="20" y1="90" x2="320" y2="60" stroke="var(--nadir)" stroke-width="1.5" opacity=".7"/>
      <line x1="20" y1="120" x2="320" y2="95" stroke="var(--nadir)" stroke-width="1.5" opacity=".7"/>
      <text x="20" y="20" class="lbl-dim">N ensemble members (t)</text>
      <line x1="320" y1="20" x2="320" y2="130" stroke="var(--accent2)" stroke-width="2"/>
      <text x="330" y="65" class="lbl-accent" style="fill:var(--accent2)">spread</text>
      <text x="330" y="80" class="lbl-accent" style="fill:var(--accent2)">≈ sample P</text>
    </g>
  </svg>
  <p class="center" style="font-size:11.5px;color:var(--ink-dim);margin-top:4px">Each line is one model member — how much the bundle "fans out" at the observation time is exactly the estimated covariance</p>
</div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Perturbed observation — why each member updates differently</h1>
<ul class="bullets"><li>In EnKF, each ensemble member doesn't update against the single value y — but against <b>y + random noise</b> sampled from the observation error distribution</li><li>This <b>perturbed observation</b> technique ensures the ensemble spread AFTER updating still reflects the true remaining uncertainty — if the same y were used for every member, the ensemble would artificially "collapse" (underestimating uncertainty)</li></ul>
`, 'Reichle et al. 2002, EnKF in hydrology — Monthly Weather Review'));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>SWOT's spatially correlated error — a specific challenge</h1>
<ul class="bullets"><li>Recalling Module 2: KaRIn's observation error <b>has a spatially correlated structure</b> — neighboring pixels/nodes don't have independent errors as in classical altimetry</li><li>Consequence: the observation error covariance matrix <b>Γ cannot be treated as a simple diagonal matrix</b> (each observation independent) — the off-diagonal terms must be explicitly modeled</li><li>Ignoring this correlation (wrongly assuming a diagonal Γ) causes the algorithm to <b>overestimate</b> SWOT's reliability, making K unjustifiably large</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Correlated-error-reduction technique before assimilation</h1>
<ul class="bullets"><li>Before feeding SWOT data into the EnKF loop, a pre-processing step is needed to <b>estimate and reduce the correlated error component</b> — e.g. separating a slowly-varying spatial error component (highly correlated) from an independent per-pixel noise component</li><li>This is an actively developing research direction, combining spatial statistics (geostatistics) with classical Kalman filter theory</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Jacques Verron — from oceanography to continental hydrology</h1>
<ul class="bullets"><li>Jacques Verron (CNRS/LEGOS) is one of the pioneers who applied the Kalman/Ensemble Kalman Filter to <b>ocean altimetry</b> data assimilation, starting in the early 1990s (the same era as TOPEX/Poseidon, Module 1)</li><li>A foundational work: <i>"Altimeter data assimilation into an ocean circulation model"</i> (JGR: Oceans, 1990) — one of the earliest applications of the Kalman filter to satellite ocean data</li><li>Current research direction: extending the same theoretical framework to <b>continental hydrology</b> with SWOT's wide-swath data — the specific challenge being spatially correlated error (previous slide), unlike the original ocean context</li></ul>
`, 'Verron (1990), JGR: Oceans'));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Real-world application: updating hydrological models with SWOT</h1>
<ul class="bullets"><li>A basin-scale hydrological/hydraulic model forecasting flow from rainfall, evaporation, terrain accumulates error over time if not "anchored" by real observations</li><li>Every time SWOT passes over a river reach (21-day cycle, Module 2), EnKF updates the model state (water level, possibly discharge — Module 4) at exactly that reach</li><li>Between observations, the model keeps running its forecast — the forecast/analysis cycle repeats continuously (see the diagram at the start of this module)</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Common mistake — assimilating uncorrected biased data</h1>
<div class="pitfall"><span class="tag-warn">Assimilating data with an uncorrected systematic bias</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">Kalman Filter/EnKF assumes zero-mean, unbiased error — if the observation or model has an undetected/uncorrected systematic bias (e.g. an unaccounted-for datum shift from Module 1, or a hydrological model that consistently over/under-forecasts), the filter will confidently converge to a WRONG value — worse than not assimilating at all.</p></div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Self-check</h1>
<div class="checkpoint"><div class="q">❓ When is the Kalman gain K large, and when is it small?</div><div class="a">K is large when the model is very uncertain (large P) relative to a reliable observation (small R) — the analysis leans toward the observation. K is small in the reverse case — staying close to the model forecast.</div></div><div class="checkpoint"><div class="q">❓ What problem does EnKF solve that the standard Kalman Filter cannot?</div><div class="a">EnKF avoids computing the enormous covariance matrix P explicitly for basin-scale problems, by approximating P with a sample covariance from N parallel ensemble members.</div></div><div class="checkpoint"><div class="q">❓ Why is SWOT's spatially correlated error a specific challenge for EnKF?</div><div class="a">Because the observation matrix Γ cannot be treated as simply diagonal — ignoring this correlation makes the algorithm overestimate observation reliability, producing an incorrectly large K.</div></div><div class="checkpoint"><div class="q">❓ In the worked example, why is K ≈ 0.038 in Example 2 despite the identical formula as Example 1?</div><div class="a">Because K = P/(P+R) depends on the RATIO between P and R, not their absolute values — in Example 2, P is much smaller than R (the model is more trustworthy than the observation), so K is small, the complete opposite of Example 1.</div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Summary</div>
<h1>Three core takeaways carried into Module 6</h1>

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Satellite flood monitoring — an overview of methods</h1>
<ul class="bullets"><li>Three main complementary sensor types: <b>SAR</b> (Sentinel-1, cloud-penetrating), <b>optical</b> (Sentinel-2, when skies are clear), and <b>altimetry height/slope</b> (Modules 1-2)</li><li>Floods typically occur alongside <b>heavy cloud cover</b> — this is why SAR plays a central role in emergency flood monitoring, regardless of weather</li><li>Combining all three sources gives the full picture: <b>flood-extent boundary</b> (SAR/optical) + <b>flood-water depth/slope</b> (altimetry)</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>SAR (Sentinel-1): the principle of flood detection</h1>
<ul class="bullets"><li>Synthetic Aperture Radar transmits and receives its own signal — working <b>day and night</b>, and <b>through cloud</b> (unlike optical sensors)</li><li>Detection principle: flat water reflects radar signal in a <b>specular</b> (mirror-like) manner — most of the energy bounces away from the antenna instead of back → the returned signal (backscatter) is <b>very low</b>, sharply contrasting with rougher surrounding land</li><li>Basic algorithm: thresholding the backscatter image — areas below the threshold are labeled "water"</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>SAR's real-world limitations for flood mapping</h1>
<div class="pitfall"><span class="tag-warn">Two main noise sources</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">① Urban double-bounce: radar signal reflects twice between the water surface and building walls, producing abnormally STRONG signal over flooded urban areas, easily mistaken for "no water". ② Strong wind roughens the water surface, breaking up specular reflection so backscatter also RISES (making the flooded area appear SMALLER than it really is).</p></div>
<ul class="bullets"><li>Partially submerged vegetation (paddy rice, mangrove forest) also produces complex signal — not a simple high/low threshold</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Optical (Sentinel-2) as a complement when conditions allow</h1>
<ul class="bullets"><li>High-resolution multispectral imagery (10-20m) — water strongly absorbs near-infrared (NIR) light, giving sharp contrast against land/vegetation in indices such as NDWI (Normalized Difference Water Index)</li><li>Limitation: only usable under <b>clear sky, daytime</b> conditions — exactly the condition that's usually <b>absent</b> while a flood is happening</li><li>Main value: confirming/refining flood boundaries AFTER clouds clear, or monitoring seasonal water extent (not urgent monitoring)</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Combining SAR + SWOT: extent plus elevation</h1>
<ul class="bullets"><li>SAR/optical gives the <b>2D boundary</b> of a flooded area — but not how deep the water is</li><li>SWOT/KaRIn (Module 2) gives <b>elevation and slope</b> of the water surface over the flooded area — combined with the SAR boundary, it becomes possible to estimate <b>flood-water volume</b>, not just area</li><li>This is the basis of the course's "Flood monitoring" module (lectured by Sabrine Amzil, Adrien Paris) — combining multiple sensors instead of using any single one alone</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Early-warning systems — the role of data speed</h1>
<ul class="bullets"><li>A useful flood-warning system needs data <b>fast enough</b> relative to how quickly water rises — not just accurate enough</li><li>Ideal chain: satellite observation → near-real-time processing (Module 3) → assimilation into a forecast model (Module 5) → warning issued before the flood peak arrives</li><li>An inherent trade-off: near-real-time data is less accurate than archive data (Module 3) — accepting this trade-off is necessary for the purpose of early warning</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Transboundary rivers — definition & the core challenge</h1>
<ul class="bullets"><li>A <b>transboundary river</b>: a basin flowing through two or more countries — over 40% of the world's land area lies within transboundary river basins</li><li>The core challenge: <b>in-situ (gauge) data</b> is usually <b>not fully shared</b> between countries, for reasons of <b>sovereignty and water security</b></li><li>Consequence: downstream countries often lack information about upstream reservoir operations/releases — putting them at a disadvantage in managing flood/drought risk</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>The Mekong River Commission (MRC)</h1>
<ul class="bullets"><li><b>MRC</b>: an intergovernmental organization coordinating management of the transboundary Mekong River, with <b>4 official member states</b> — Thailand, Laos, Cambodia, Vietnam (China and Myanmar are dialogue partners, not full members)</li><li>Role: sharing hydrological information, coordinating mainstream project operations, negotiating during cross-border drought/flood events</li><li>VSEO6's programme representative: Mathias Boun Hen — a direct link between the course content and a real regional water-management organization</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Why satellites are a neutral source of observation</h1>
<ul class="bullets"><li>Satellite data (altimetry Modules 1-2, SAR/optical earlier in Module 6) <b>doesn't depend on any country agreeing to share its gauge data</b> — the satellite observes the whole basin equally, regardless of borders</li><li>It provides a <b>shared, consistent baseline</b> that all stakeholders can reference, reducing the information asymmetry between upstream and downstream</li><li>It doesn't fully replace the need for political cooperation — but it substantially removes one persistent technical barrier to transboundary management</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Virtual gauge — a satellite-based gauge substitute</h1>
<ul class="bullets"><li><b>Virtual gauge</b>: the idea of using a satellite-derived water-level/discharge time series (Modules 1, 2, 4) to serve as a "gauge" at a location with no physical instrument</li><li>Especially useful at <b>strategically sensitive</b> locations — e.g. just downstream of a large hydropower dam — where installing a physical gauge may face diplomatic/logistical obstacles</li><li>Increases transparency: downstream parties can monitor water-level/discharge changes near a dam themselves, without depending on figures released by the upstream country</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Connecting to Module 4: monitoring upstream reservoir operation</h1>
<ul class="bullets"><li>Use SWOT (LakeSP, Module 3) to track <b>upstream reservoir volume change</b> over time — inferring approximate water storage/release</li><li>Combine with downstream discharge estimation (Module 4, BAM/AMHG) — one can indirectly infer a dam's <b>actual operating pattern</b>, even when the operator doesn't publish its release schedule</li><li>This is the most direct real-world application linking Module 2 (measuring lakes), Module 3 (data products), and Module 4 (discharge inference) into one concrete transboundary-management problem</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Connecting to Module 5: transboundary flood forecasting</h1>
<ul class="bullets"><li>A downstream flood-forecasting model needs to know the upstream flow state — but if upstream data isn't shared, the model must rely entirely on satellite observation</li><li>Data assimilation (Module 5, EnKF) allows <b>continuous updating</b> of the forecast model's state using the latest satellite observations along a transboundary river — even with no in-situ data on the upstream side</li><li>This is why Module 5 (theory) and Module 6 (application) are always taught back-to-back in the course (Thursday → Friday in the original programme)</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Data latency vs the speed of a rising flood</h1>
<ul class="bullets"><li>SWOT has a <b>~21-day</b> repeat cycle (Module 2) — for a flood that unfolds over just a few days, this observation frequency is <b>not fast enough</b> to track the full event continuously</li><li>SAR (Sentinel-1) has a shorter repeat cycle (6-12 days depending on configuration) — better suited to flood monitoring, but still not "continuous"</li><li>→ A single satellite cannot fully replace numerical forecasting — its real role is <b>periodic correction</b> (Module 5) of a model running continuously between observations</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Case study: the StockWater reservoir-monitoring project</h1>
<ul class="bullets"><li>The <b>StockWater</b> project (CNES/SCO — Space Climate Observatory/SWOT Downstream): uses SWOT data to monitor water volume in agricultural reservoirs, particularly in semi-arid regions</li><li>It directly combines the LakeSP technique (Module 3) with a real-world need: agricultural water managers need to know remaining irrigation water without surveying every reservoir on the ground</li><li>It illustrates a "downstream application" model: taking a standard SWOT science product and packaging it into an operational tool for non-remote-sensing-specialist end users</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Case study: river-channel identification via PIXC — the Rhine</h1>
<ul class="bullets"><li>Research by Sabrine Amzil's group (Université de Strasbourg/SERTIT) uses <b>L2_HR_PIXC</b> directly (Module 3, raw pixel data) to identify river-channel boundaries for the Rhine</li><li>It illustrates a real application that goes <b>against the standard pipeline</b>: instead of using the ready-processed RiverSP, it returns to the raw PIXC data when finer spatial detail is needed than the Node/Reach level provides — trading more processing effort for that detail</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Common mistake — expecting SWOT to be a continuous monitoring system</h1>
<div class="pitfall"><span class="tag-warn">SWOT is not a real-time sensor</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">With a 21-day repeat cycle, SWOT suits trend research, periodic model correction, and long-term monitoring — it is not suited as the SOLE data source for an emergency flood-warning system that needs hourly/daily information. Always combine it with higher-frequency SAR and a continuously running numerical model.</p></div>
`));

<h1>Self-check</h1>
<div class="checkpoint"><div class="q">❓ Why is SAR the primary tool for emergency flood monitoring rather than optical imagery?</div><div class="a">Because SAR works day/night and through cloud, while floods usually coincide with heavy cloud cover, making optical imagery (Sentinel-2) unusable exactly when it's needed most.</div></div><div class="checkpoint"><div class="q">❓ What is a virtual gauge and why is it useful for transboundary management?</div><div class="a">Using a satellite time series as a 'virtual gauge' at a location with no physical instrument — useful at sensitive locations like just downstream of a dam, increasing transparency without needing a gauge run by the upstream country.</div></div><div class="checkpoint"><div class="q">❓ Why isn't SWOT's 21-day cycle enough on its own for emergency flood warning?</div><div class="a">Because floods unfold over just a few days, much faster than a 21-day observation frequency — higher-frequency SAR and a continuously running numerical model, periodically corrected by SWOT (Module 5), are both needed.</div></div><div class="checkpoint"><div class="q">❓ Why is SAR affected by both urban double-bounce and strong wind, and which direction do these two effects bias results?</div><div class="a">Urban double-bounce artificially INCREASES backscatter over flooded areas with buildings (easily misread as NO water); strong wind also INCREASES backscatter by roughening the water surface (making the flooded extent appear SMALLER than reality) — both push toward underestimating flood extent, via two different physical mechanisms.</div></div>
`));

/* ============ ENGINE ============ */
const deck = document.getElementById('deck');
SLIDES.forEach(html => {
  const div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = html;
  deck.appendChild(div);
});
let idx = 0;
const total = SLIDES.length;
function render(){
  deck.style.transform = `translateX(-${idx*100}vw)`;
  document.getElementById('progress').style.width = ((idx+1)/total*100) + '%';
  const cur = deck.children[idx];
  let num = cur.querySelector('.slidenum');
  deck.querySelectorAll('.slidenum').forEach(e=>e.remove());
  const n = document.createElement('div');
  n.className = 'slidenum';
  n.textContent = (idx+1) + ' / ' + total;
  cur.appendChild(n);
  cur.querySelectorAll('.fadein').forEach(el=>{ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; });
}
function go(delta){ idx = Math.max(0, Math.min(total-1, idx+delta)); render(); }
document.addEventListener('keydown', e=>{
  if (['ArrowRight','PageDown',' '].includes(e.key)) { go(1); e.preventDefault(); }
  else if (['ArrowLeft','PageUp'].includes(e.key)) { go(-1); e.preventDefault(); }
  else if (e.key === 'Home') { idx=0; render(); }
  else if (e.key === 'End') { idx=total-1; render(); }
});
document.addEventListener('click', e=>{
  const w = window.innerWidth;
  if (e.clientX > w*0.6) go(1); else if (e.clientX < w*0.4) go(-1);
});
render();
</script>
