<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSEO6 — Satellite Altimetry for Continental Water Monitoring</title>
<style>
:root{
  --bg:#0b1220; --panel:#101b30; --panel2:#132140; --line:#25406b;
  --ink:#eaf0ff; --ink-dim:#9fb2d6; --accent:#4fd1c5; --accent2:#f2b84b;
  --nadir:#7aa7ff; --swot:#4fd1c5; --danger:#ff7a7a; --good:#7ee08a;
  --sw: 1160px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
#deck{position:relative;width:100vw;height:100vh;display:flex;
  transition:transform .45s cubic-bezier(.65,0,.35,1)}
.slide{flex:0 0 100vw;height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:48px 64px;position:relative}
.slide-inner{width:100%;max-width:var(--sw)}
.eyebrow{color:var(--accent);font-size:15px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
h1{font-size:40px;line-height:1.2;margin:0 0 18px;font-weight:800;letter-spacing:-.01em}
h2{font-size:29px;line-height:1.3;margin:0 0 22px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
p.lead{font-size:18px;color:var(--ink-dim);line-height:1.6;max-width:820px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card h3{margin:0 0 8px;font-size:16px;color:var(--accent2)}
.card p{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.55}
ul.bullets{margin:0;padding-left:20px;font-size:16px;line-height:1.75;color:var(--ink)}
ul.bullets li{margin-bottom:8px}
ul.bullets b{color:var(--accent2)}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:4px 12px;font-size:12.5px;color:var(--ink-dim);margin-right:6px}
.tag{display:inline-block;background:rgba(79,209,197,.15);color:var(--accent);border:1px solid rgba(79,209,197,.4);
  border-radius:7px;padding:2px 9px;font-size:12px;font-weight:700;letter-spacing:.04em}
.tag.warn{background:rgba(255,122,122,.12);color:var(--danger);border-color:rgba(255,122,122,.35)}
.tag.good{background:rgba(126,224,138,.12);color:var(--good);border-color:rgba(126,224,138,.35)}
.footcite{position:absolute;bottom:26px;left:64px;right:64px;font-size:11.5px;color:#5c6f96;
  border-top:1px solid var(--line);padding-top:8px}
.footcite a{color:#7d92c2}
.slidenum{position:absolute;bottom:26px;right:64px;font-size:12px;color:#5c6f96}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:50;transition:width .4s}
.navhint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:#425079;
  letter-spacing:.05em;z-index:50}
.center{text-align:center}
.cover .kicker{color:var(--accent2);font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:16px}
.cover h1{font-size:52px}
.cover .sub{font-size:19px;color:var(--ink-dim);max-width:760px;margin:0 auto 26px}
.cover .meta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* ---- schedule grid ---- */
.sched-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:10px}
.sched-day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 12px;font-size:12.5px}
.sched-day .d{font-weight:800;color:var(--accent2);margin-bottom:2px;font-size:13px}
.sched-day .t{color:var(--ink-dim);margin-bottom:8px;font-size:11.5px}
.sched-day ul{margin:0;padding-left:14px;line-height:1.55;color:var(--ink)}

/* ---- module nav / roadmap ---- */
.roadmap{display:flex;flex-direction:column;gap:10px}
.rstep{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 18px}
.rstep .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--accent);
  color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.rstep .t{font-size:15.5px;font-weight:700}
.rstep .s{font-size:12.5px;color:var(--ink-dim)}

/* ---- speaker cards ---- */
.spk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.spk h3{margin:0 0 3px;font-size:16.5px;color:var(--ink)}
.spk .aff{font-size:12.5px;color:var(--accent);margin-bottom:8px}
.spk ul{margin:0;padding-left:16px;font-size:12px;line-height:1.55;color:var(--ink-dim)}

/* ---- SVG diagram scaffolding ---- */
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
svg text{font-family:inherit}
.lbl{fill:var(--ink);font-size:13px}
.lbl-dim{fill:var(--ink-dim);font-size:11.5px}
.lbl-accent{fill:var(--accent);font-size:12px;font-weight:700}

/* radar pulse: nadir round trip */
@keyframes pulseDown{
  0%{ transform:translateY(0); opacity:1; }
  48%{ transform:translateY(150px); opacity:1; }
  50%{ transform:translateY(150px); opacity:0; }
  100%{ transform:translateY(150px); opacity:0; }
}
@keyframes pulseUp{
  0%{ transform:translateY(150px); opacity:0; }
  50%{ transform:translateY(150px); opacity:0; }
  52%{ transform:translateY(150px); opacity:1; }
  100%{ transform:translateY(0); opacity:1; }
}
.pulse-down{animation:pulseDown 2.6s ease-in-out infinite}
.pulse-up{animation:pulseUp 2.6s ease-in-out infinite}

/* satellite moving along track (KaRIn) */
@keyframes flyRight{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(430px); }
}
.fly{animation:flyRight 6s linear infinite}

/* EnKF cycle: rotating highlight around loop, translate-based (no rotation-direction ambiguity) */
@keyframes dashFlow{ to{ stroke-dashoffset:-200; } }
.flow-line{stroke-dasharray:6 6; animation:dashFlow 3s linear infinite}

.fadein{animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}

/* ---- module divider (section title) ---- */
.divider{width:100%;text-align:center}
.divider .modnum{display:inline-flex;width:64px;height:64px;border-radius:50%;background:var(--panel2);
  border:2px solid var(--accent);color:var(--accent);align-items:center;justify-content:center;
  font-size:26px;font-weight:800;margin-bottom:18px}
.divider .kicker{color:var(--accent2);font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.divider h1{font-size:44px;max-width:900px;margin:0 auto 16px}
.divider .sub{font-size:17px;color:var(--ink-dim);max-width:760px;margin:0 auto}
.modmap{display:flex;justify-content:center;gap:8px;margin-top:28px;flex-wrap:wrap}
.modmap span{padding:5px 12px;border-radius:999px;font-size:12px;background:var(--panel);
  border:1px solid var(--line);color:var(--ink-dim)}
.modmap span.cur{background:rgba(79,209,197,.15);color:var(--accent);border-color:var(--accent);font-weight:700}

/* ---- equation / formula display ---- */
.eqn-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 26px;margin:14px 0}
.eqn-box .eqn{font-family:Cambria,"Times New Roman",serif;font-size:22px;color:var(--accent2);font-weight:700;text-align:center}
.eqn-box .eqn-note{font-size:12.5px;color:var(--ink-dim);margin-top:10px;text-align:center;line-height:1.5}
.eqn-inline{font-family:Cambria,"Times New Roman",serif;color:var(--accent2);font-weight:700}

/* ---- worked example ---- */
.example-box{background:var(--panel2);border:1px dashed var(--accent);border-radius:14px;padding:18px 22px}
.example-box .tag-ex{display:inline-block;background:rgba(79,209,197,.15);color:var(--accent);border:1px solid rgba(79,209,197,.4);
  border-radius:7px;padding:2px 10px;font-size:11.5px;font-weight:700;letter-spacing:.05em;margin-bottom:10px}
.example-box .step{font-size:14.5px;line-height:1.7;color:var(--ink);margin-bottom:4px}
.example-box .step b{color:var(--accent2)}

/* ---- pitfall / common mistake ---- */
.pitfall{background:rgba(255,122,122,.08);border:1px solid rgba(255,122,122,.35);border-radius:14px;padding:18px 22px}
.pitfall .tag-warn{display:inline-block;background:rgba(255,122,122,.15);color:var(--danger);border:1px solid rgba(255,122,122,.4);
  border-radius:7px;padding:2px 10px;font-size:11.5px;font-weight:700;letter-spacing:.05em;margin-bottom:10px}

/* ---- self-check / checkpoint ---- */
.checkpoint{background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:18px 22px;margin-bottom:12px}
.checkpoint .q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px}
.checkpoint .a{font-size:13.5px;color:var(--accent);line-height:1.6}
.checkpoint .a::before{content:"→ "; color:var(--accent2)}

/* ---- summary recap list ---- */
.recap-item{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 16px;margin-bottom:8px}
.recap-item .ico{flex:0 0 auto;font-size:18px}
.recap-item .txt{font-size:14px;color:var(--ink-dim);line-height:1.55}
.recap-item .txt b{color:var(--ink)}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div id="deck"></div>
<div class="navhint">← → hoặc Space để chuyển slide &nbsp;·&nbsp; số slide hiện tại ở góc dưới phải</div>

<script>
/* ============ SLIDE CONTENT ============ */
const SLIDES = [];
function slide(html){ SLIDES.push(html); }
function wrap(inner, cite){
  return '<div class="slide-inner">' + inner + '</div>' +
    (cite ? '<div class="footcite">Nguồn: ' + cite + '</div>' : '');
}


slide(`
<div class="slide-inner cover center fadein">
  <div class="kicker">Bộ slide kiến thức — không phải slide giới thiệu trường</div>
  <h1>Satellite Altimetry cho giám sát nước lục địa</h1>
  <p class="sub">6 module — mỗi module: định nghĩa → phương trình → ví dụ tính tay → sơ đồ → sản phẩm dữ liệu thực → sai lầm thường gặp → tự kiểm tra → tóm tắt.</p>
  <div class="modmap"><span>1 · Nadir Altimetry</span><span>2 · SWOT / KaRIn</span><span>3 · Hydroweb-next</span><span>4 · Discharge (Q)</span><span>5 · Data Assimilation</span><span>6 · Flood & Xuyên biên giới</span></div>
</div>
`);

slide(wrap(`
<div class="slide-inner divider fadein"><div class="modnum">1</div><div class="kicker">Kiến thức nền tảng VSEO6</div><h1>Nadir (Radar) Altimetry</h1><p class="sub">Kỹ thuật đo cao cổ điển bằng radar thẳng đứng — nền tảng của mọi phép đo cao vệ tinh sau này.</p><div class="modmap"><span class="cur">1 · Nadir Altimetry</span><span class="">2 · SWOT / KaRIn</span><span class="">3 · Hydroweb-next</span><span class="">4 · Discharge (Q)</span><span class="">5 · Data Assimilation</span><span class="">6 · Flood & Xuyên biên giới</span></div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Định nghĩa: đo khoảng cách bằng thời gian bay của xung radar</h1>
<div class="grid2">
  <ul class="bullets">
    <li>Vệ tinh mang một <b>altimeter radar</b> phát xung xuống thẳng theo phương <b>nadir</b> (thẳng đứng dưới chân vệ tinh)</li>
    <li>Xung phản xạ lại từ mặt nước/đất, ăng-ten thu lại tín hiệu</li>
    <li>Đo <b>thời gian đi–về</b> Δt của xung → suy ra khoảng cách vệ tinh–bề mặt R</li>
    <li>Kết hợp R với độ cao quỹ đạo vệ tinh (biết chính xác từ hệ thống định vị) → độ cao bề mặt h</li>
  </ul>
  <div class="diagram">
    <svg viewBox="0 0 300 220" width="100%">
      <rect x="0" y="190" width="300" height="30" fill="#0c1830"/>
      <rect x="120" y="20" width="60" height="24" rx="4" fill="#1b2c52" stroke="var(--nadir)"/>
      <text x="150" y="36" text-anchor="middle" class="lbl" font-size="11">vệ tinh</text>
      <line x1="150" y1="44" x2="150" y2="170" stroke="var(--nadir)" stroke-width="2" stroke-dasharray="3 4" class="pulse-down"/>
      <line x1="150" y1="170" x2="150" y2="44" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 4" class="pulse-up"/>
      <text x="160" y="110" class="lbl-dim" font-size="11">R</text>
      <text x="150" y="205" text-anchor="middle" class="lbl-dim" font-size="11">mặt nước</text>
    </svg>
    <p class="center" style="font-size:12px;color:var(--ink-dim);margin-top:6px">Xung radar đi xuống rồi phản xạ về — thời gian Δt tỉ lệ với 2×R</p>
  </div>
</div>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Phương trình khoảng cách (range equation)</h1>
<div class="eqn-box"><div class="eqn">R = c · &Delta;t / 2</div><div class="eqn-note">c: vận tốc ánh sáng (3×10⁸ m/s) · Δt: thời gian đi–về đo được bởi altimeter</div></div>
<ul class="bullets"><li>Chia đôi vì xung đi <b>xuống rồi lại về</b> — Δt là tổng thời gian cả hai chiều</li><li>Δt cỡ vài phần nghìn giây (altimeter bay ở độ cao ~800–1300 km)</li><li>R đo được ở đây là <b>khoảng cách thô</b> — chưa phải độ cao mặt nước, cần thêm bước tiếp theo</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Từ khoảng cách R ra độ cao mặt nước h</h1>
<div class="eqn-box"><div class="eqn">h = H<sub>sat</sub> &minus; (R + &Sigma; hiệu chỉnh)</div><div class="eqn-note">H_sat: độ cao quỹ đạo vệ tinh so với ellipsoid tham chiếu — biết chính xác cỡ cm nhờ precise orbit determination (POD)</div></div>
<ul class="bullets"><li>H_sat không đo bằng altimeter — mà bằng hệ thống định vị quỹ đạo riêng (GPS/DORIS trên vệ tinh + trạm mặt đất)</li><li>R phải cộng thêm các <b>hiệu chỉnh địa vật lý</b> (khí quyển, thủy triều...) trước khi trừ — xem slide sau</li><li>h cuối cùng là độ cao so với <b>ellipsoid</b> — không phải mực nước biển thực (xem Module 1, slide geoid)</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Retracking — vì sao không dùng thẳng thời gian tín hiệu thô</h1>
<ul class="bullets"><li>Xung phản xạ tạo ra một <b>dạng sóng (waveform)</b> theo thời gian, không phải một điểm thời gian duy nhất</li><li>Bộ theo dõi trên vệ tinh (onboard tracker) chỉ khóa gần đúng — cần xử lý lại dưới mặt đất để xác định chính xác điểm xung <i>chạm tới bề mặt</i></li><li><b>Retracking</b>: khớp một mô hình toán học với waveform thực đo để tìm lại điểm mốc thời gian chính xác hơn</li><li>Trên đại dương rộng, phẳng: waveform gần chuẩn (mô hình Brown). Trên sông/hồ hẹp: waveform bị méo bởi bờ, thảm thực vật — cần retracker chuyên biệt</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Hai retracker khác nhau cho hai loại bề mặt</h1>
<div class="grid2">
  <div class="card"><h3>Brown model (đại dương)</h3><p>Giả định mặt biển thống kê phẳng, phân bố Gauss độ cao sóng — cho waveform "chuẩn" một đỉnh trơn. Phù hợp mặt nước rộng, đồng nhất.</p></div>
  <div class="card"><h3>OCOG / Threshold retracker (nước lục địa)</h3><p>Không giả định dạng sóng cụ thể — tìm trọng tâm năng lượng (OCOG) hoặc ngưỡng % biên độ đỉnh. Chịu được waveform nhiễu, nhiều đỉnh do bờ sông/thực vật.</p></div>
</div>
<div class="pitfall"><span class="tag-warn">Sai lầm thường gặp</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">Dùng retracker chuẩn đại dương (Brown) cho sông hẹp &lt;1km sẽ cho kết quả sai lệch hệ thống — vì giả định nền tảng (mặt phẳng rộng) không đúng với hình học sông.</p></div>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Ví dụ tính tay: từ Δt ra R</h1>
<div class="example-box"><span class="tag-ex">Ví dụ</span><div class="step">Cho: altimeter đo được Δt = 5.34 ms = 5.34×10⁻³ s</div><div class="step">Áp dụng: <b>R = c·Δt/2</b> = (3×10⁸ m/s × 5.34×10⁻³ s) / 2</div><div class="step">= (1 602 000 m) / 2 = <b>801 000 m ≈ 801 km</b></div><div class="step">Nếu H_sat (quỹ đạo) = 803 km và tổng hiệu chỉnh ≈ +0.3 m: h = 803 000 − (801 000 + 0.3) ≈ <b>1 999.7 m</b> so với ellipsoid</div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Waveform: hình dạng tín hiệu phản xạ nói lên điều gì</h1>
<div class="diagram">
  <svg viewBox="0 0 360 140" width="100%">
    <polyline points="10,120 60,118 100,60 130,30 160,45 200,75 260,95 340,105" fill="none" stroke="var(--nadir)" stroke-width="2.5"/>
    <text x="100" y="20" class="lbl-dim" font-size="10">Đại dương (Brown): 1 đỉnh, sườn trơn</text>

`));

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Bảng tổng hợp sai số — precision budget</h1>
<table style="width:100%;border-collapse:collapse;font-size:13.5px">
  <tr style="color:var(--accent2)"><td style="padding:8px 6px"><b>Nguồn sai số</b></td><td style="padding:8px 6px"><b>Độ lớn điển hình</b></td><td style="padding:8px 6px"><b>Đặc điểm</b></td></tr>
  <tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px">Tầng đối lưu khô</td><td style="padding:8px 6px;color:var(--ink-dim)">~2.3 m</td><td style="padding:8px 6px;color:var(--ink-dim)">Ổn định, mô hình hoá tốt</td></tr>

slide(wrap(`

slide(wrap(`
<div class="eyebrow">Module 1 · Nadir Altimetry</div>
<h1>Datum thẳng đứng: ellipsoid vs geoid</h1>
<div class="eqn-box"><div class="eqn">H (độ cao chính) = h<sub>ellipsoid</sub> &minus; N<sub>geoid</sub></div><div class="eqn-note">N_geoid: độ lệch geoid–ellipsoid tại vị trí đó, tra từ mô hình toàn cầu (vd EGM2008)</div></div>
<ul class="bullets"><li>Độ cao h ra từ range equation là so với <b>ellipsoid</b> — một mặt toán học trơn (vd WGS84), không phải mực nước biển thực</li><li><b>Geoid</b>: bề mặt đẳng thế trọng lực, xấp xỉ mực nước biển trung bình nếu bỏ qua gió/dòng chảy — gồ ghề hơn ellipsoid vì phản ánh phân bố khối lượng Trái Đất thật</li><li>Trạm đo tại chỗ (in-situ gauge) thường báo cáo theo datum địa phương gần geoid — <b>không thể so trực tiếp</b> với h_ellipsoid nếu chưa quy đổi</li></ul>
<div class="pitfall"><span class="tag-warn">Sai lầm thường gặp</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">So sánh trực tiếp độ cao vệ tinh (ellipsoid) với số liệu trạm đo (datum địa phương) mà không quy đổi qua geoid — chênh lệch có thể vài mét, bị hiểu nhầm là 'lỗi vệ tinh'.</p></div>
`));

slide(wrap(`

<div class="slide-inner divider fadein"><div class="modnum">4</div><div class="kicker">Kiến thức nền tảng VSEO6</div><h1>Ước tính lưu lượng dòng chảy (Discharge)</h1><p class="sub">Từ ba đại lượng vệ tinh đo được (W, h, S) đến con số Q mà nhà quản lý nước thực sự cần.</p><div class="modmap"><span class="">1 · Nadir Altimetry</span><span class="">2 · SWOT / KaRIn</span><span class="">3 · Hydroweb-next</span><span class="cur">4 · Discharge (Q)</span><span class="">5 · Data Assimilation</span><span class="">6 · Flood & Xuyên biên giới</span></div></div>

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Discharge Q là gì, và vì sao là đại lượng quan trọng nhất</h1>
<ul class="bullets"><li><b>Discharge (lưu lượng)</b> Q: thể tích nước chảy qua một mặt cắt sông trong một đơn vị thời gian, đơn vị m³/s</li><li>Đây là đại lượng mà các cơ quan quản lý nước, dự báo lũ, vận hành hồ chứa <b>thực sự cần</b> — không phải bản thân độ cao mặt nước</li><li>Trạm đo tại chỗ (in-situ gauge) truyền thống đo Q bằng <b>rating curve</b>: quan hệ thực nghiệm giữa mực nước tại trạm và Q đo trực tiếp (tốn công, cần đo nhiều lần theo thời gian để xây dựng đường cong)</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Vì sao vệ tinh không đo Q trực tiếp — nhắc lại từ Module 1 & 2</h1>
<ul class="bullets"><li>Nadir altimetry (Module 1) chỉ cho <b>độ cao tại điểm</b> — muốn ra Q cần rating curve xây từ số liệu tại chỗ, tức vẫn phụ thuộc trạm đo vật lý</li><li>SWOT/KaRIn (Module 2) cho <b>độ cao h, độ dốc S, độ rộng W</b> trên toàn đoạn sông — nhiều hơn nadir, nhưng vẫn <b>không phải chính Q</b></li><li>→ Cần một <b>mô hình thủy lực</b> chuyển đổi (W, h, S) thành Q mà không cần đo trực tiếp tốc độ dòng chảy — đây là nội dung cốt lõi của Module 4</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Phương trình liên tục: Q = A·V</h1>
<div class="eqn-box"><div class="eqn">Q = A · V</div><div class="eqn-note">A: diện tích mặt cắt ướt (m²) · V: vận tốc trung bình dòng chảy (m/s)</div></div>
<ul class="bullets"><li>Đây là định nghĩa cơ bản nhất của lưu lượng — thể tích/giây bằng diện tích mặt cắt nhân vận tốc trung bình qua mặt cắt đó</li><li>Vấn đề: vệ tinh không đo được <b>A</b> (cần biết hình dạng đáy sông, ẩn dưới mặt nước) cũng không đo được <b>V</b> trực tiếp</li><li>Cần thêm một phương trình thứ hai liên hệ V với các đại lượng <b>quan sát được</b> (W, h, S) — đó là phương trình Manning</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Phương trình Manning: liên hệ vận tốc với độ dốc</h1>
<div class="eqn-box"><div class="eqn">V = (1/n) · R<sub>h</sub><sup>2/3</sup> · S<sup>1/2</sup></div><div class="eqn-note">n: hệ số nhám Manning (phụ thuộc vật liệu đáy/bờ sông) · R_h: bán kính thủy lực ≈ A/chu vi ướt · S: độ dốc mặt nước</div></div>
<ul class="bullets"><li>Phương trình thực nghiệm kinh điển trong thủy lực học kênh hở, dùng từ hơn 100 năm nay cho sông/kênh mương</li><li><b>S</b> (độ dốc mặt nước dọc sông) chính là đại lượng SWOT đo trực tiếp được (Module 2) — đây là lý do SWOT có giá trị đặc biệt cho bài toán này</li><li><b>R_h</b> với sông rộng gần đúng bằng độ sâu trung bình — vẫn cần liên hệ với W, h quan sát được</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Vấn đề cốt lõi: A và n là ẩn số, không quan sát được</h1>
<div class="pitfall"><span class="tag-warn">Hai ẩn số then chốt</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">Diện tích mặt cắt ướt A phụ thuộc hình dạng đáy sông (bathymetry) — vệ tinh không nhìn xuyên qua nước để đo. Hệ số nhám n phụ thuộc vật liệu đáy/bờ, thực vật — cũng không đo trực tiếp từ ảnh vệ tinh một cách đáng tin cậy. Cả hai đều phải SUY LUẬN từ chuỗi thời gian W-h-S mà SWOT cung cấp.</p></div>
<ul class="bullets"><li>Ý tưởng chung của mọi thuật toán discharge cho SWOT: dùng nhiều lần quan sát (W, h, S) theo thời gian tại cùng một đoạn sông để <b>ràng buộc ngược</b> giá trị A và n ẩn, dựa trên giả định chúng ổn định hoặc biến đổi có quy luật</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 4 · Discharge</div>
<h1>Hydraulic geometry cổ điển — nền tảng ý tưởng AMHG</h1>
<div class="eqn-box"><div class="eqn">W = a·Q<sup>b</sup>,&nbsp; D = c·Q<sup>f</sup>,&nbsp; V = k·Q<sup>m</sup></div><div class="eqn-note">Leopold & Maddock (1953): độ rộng W, độ sâu D, vận tốc V biến đổi theo lũy thừa của Q tại một mặt cắt cố định (at-a-station)</div></div>

`));

<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Kalman Filter — giả định nền tảng</h1>
<ul class="bullets"><li>Giả định mô hình <b>tuyến tính</b> (hoặc gần tuyến tính) và sai số tuân theo <b>phân bố Gauss</b></li><li>Dưới giả định này, kết hợp tối ưu (theo nghĩa phương sai nhỏ nhất) giữa dự báo và quan sát có <b>công thức đóng (closed-form)</b> — không cần thử nhiều phương án, tính trực tiếp ra kết quả tối ưu</li><li>Đây là lý do Kalman Filter trở thành công cụ chuẩn trong dẫn đường tên lửa, định vị vệ tinh, và sau này là khoa học khí hậu/thủy văn</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Phương trình phân tích (analysis step)</h1>
<div class="eqn-box"><div class="eqn">z<sup>a</sup> = z<sup>f</sup> + K(y &minus; H·z<sup>f</sup>)</div><div class="eqn-note">z^f: trạng thái dự báo (forecast) · y: quan sát (vd mực nước từ altimetry) · H: toán tử quan sát · z^a: trạng thái sau phân tích</div></div>
<ul class="bullets"><li><b>H</b> (observation operator): "dịch" trạng thái mô hình sang không gian có thể so sánh trực tiếp với quan sát — vd nếu z là mực nước tại Node nhưng y đo tại vị trí khác, H nội suy không gian</li><li><b>(y − H·z^f)</b> gọi là <b>innovation</b> — chênh lệch giữa quan sát thực và dự báo mô hình, chính là "tín hiệu mới" mà quan sát mang lại</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Hệ số Kalman (Kalman gain) K</h1>
<div class="eqn-box"><div class="eqn">K = P·H<sup>T</sup> (H·P·H<sup>T</sup> + R)<sup>&minus;1</sup></div><div class="eqn-note">P: hiệp phương sai sai số dự báo (độ bất định mô hình) · R: hiệp phương sai sai số quan sát</div></div>
<ul class="bullets"><li>K quyết định <b>bao nhiêu phần trăm</b> của innovation được đưa vào cập nhật trạng thái</li><li>Nếu mô hình rất bất định (P lớn) so với quan sát rất tin cậy (R nhỏ) → K lớn → phân tích nghiêng mạnh về phía quan sát</li><li>Nếu ngược lại (mô hình tin cậy hơn quan sát) → K nhỏ → giữ nguyên gần với dự báo mô hình</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Ví dụ tính tay: tính K cho một biến số vô hướng</h1>
<div class="example-box"><span class="tag-ex">Ví dụ (đơn giản hoá về trường hợp 1 biến, không phải ma trận)</span><div class="step">Cho: mô hình dự báo mực nước z^f = 5.0 m, độ bất định (phương sai) P = 0.25 m² (độ lệch chuẩn 0.5m)</div><div class="step">Quan sát SWOT: y = 5.3 m, độ bất định quan sát R = 0.01 m² (độ lệch chuẩn 0.1m, khá tin cậy)</div><div class="step">Giả sử H = 1 (quan sát trực tiếp cùng biến): <b>K = P/(P+R)</b> = 0.25/(0.25+0.01) ≈ <b>0.962</b></div><div class="step">z^a = z^f + K(y − z^f) = 5.0 + 0.962×(5.3−5.0) = 5.0 + 0.289 ≈ <b>5.29 m</b></div><div class="step">K gần 1 vì quan sát tin cậy hơn hẳn mô hình — kết quả phân tích rất gần với quan sát y</div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Giới hạn của Kalman Filter chuẩn cho bài toán lớn</h1>
<div class="pitfall"><span class="tag-warn">P không thể tính tường minh ở quy mô lớn</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">Với một lưu vực có z chứa hàng nghìn/triệu thành phần (slide state vector), ma trận hiệp phương sai P có kích thước (số thành phần)² — quá lớn để lưu trữ và cập nhật trực tiếp bằng bộ nhớ/tính toán thông thường.</p></div>
<ul class="bullets"><li>→ Cần một phương pháp <b>xấp xỉ P</b> mà không cần tính tường minh toàn bộ ma trận — đây chính là động lực ra đời của Ensemble Kalman Filter</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Ensemble Kalman Filter (EnKF) — ý tưởng cốt lõi</h1>
<ul class="bullets"><li>Thay vì tính P tường minh, chạy <b>N bản sao mô hình song song</b> (ensemble), mỗi bản có nhiễu động ban đầu/tham số khác nhau một chút</li><li>Độ phân tán giữa N thành viên ensemble tại một thời điểm chính là ước lượng <b>hiệp phương sai mẫu</b> — thay thế cho P mà không cần công thức giải tích</li><li>N thường từ vài chục đến vài trăm — nhỏ hơn rất nhiều so với kích thước đầy đủ của P, nhưng đủ để nắm bắt cấu trúc bất định quan trọng nhất</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Phương trình EnKF: forecast & analysis</h1>
<div class="eqn-box"><div class="eqn">z<sub>i</sub><sup>f</sup> = M(z<sub>i</sub>), &nbsp; i = 1…N</div><div class="eqn-note">Bước forecast: mỗi thành viên ensemble chạy qua mô hình động lực M độc lập</div></div>
<div class="eqn-box"><div class="eqn">K<sub>j</sub> = Ĉ<sub>j</sub>·H<sub>j</sub><sup>T</sup> (H<sub>j</sub>·Ĉ<sub>j</sub>·H<sub>j</sub><sup>T</sup> + &Gamma;<sub>j</sub>)<sup>&minus;1</sup></div><div class="eqn-note">Bước analysis: Ĉ_j là hiệp phương sai MẪU tính từ ensemble dự báo (thay cho P) · Γ_j: hiệp phương sai sai số quan sát</div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Sơ đồ ensemble: N thành viên chạy song song</h1>
<div class="diagram" style="max-width:560px;margin:0 auto">
  <svg viewBox="0 0 440 160" width="100%">
    <g font-size="11">
      <line x1="20" y1="30" x2="320" y2="30" stroke="var(--nadir)" stroke-width="1.5" opacity=".7"/>
      <line x1="20" y1="60" x2="320" y2="70" stroke="var(--nadir)" stroke-width="1.5" opacity=".7"/>
      <line x1="20" y1="90" x2="320" y2="60" stroke="var(--nadir)" stroke-width="1.5" opacity=".7"/>
      <line x1="20" y1="120" x2="320" y2="95" stroke="var(--nadir)" stroke-width="1.5" opacity=".7"/>
      <text x="20" y="20" class="lbl-dim">N thành viên ensemble (t)</text>
      <line x1="320" y1="20" x2="320" y2="130" stroke="var(--accent2)" stroke-width="2"/>
      <text x="330" y="65" class="lbl-accent" style="fill:var(--accent2)">độ phân tán</text>
      <text x="330" y="80" class="lbl-accent" style="fill:var(--accent2)">≈ P mẫu</text>
    </g>
  </svg>
  <p class="center" style="font-size:11.5px;color:var(--ink-dim);margin-top:4px">Mỗi đường là một thành viên mô hình — độ "toè ra" của bó đường tại thời điểm quan sát chính là hiệp phương sai ước lượng</p>
</div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Perturbed observation — vì sao mỗi thành viên cập nhật khác nhau</h1>
<ul class="bullets"><li>Trong EnKF, mỗi thành viên ensemble không cập nhật với đúng một giá trị quan sát y — mà với <b>y + nhiễu ngẫu nhiên</b> lấy mẫu từ phân bố sai số quan sát</li><li>Kỹ thuật <b>perturbed observation</b> này đảm bảo độ phân tán ensemble SAU khi cập nhật vẫn phản ánh đúng độ bất định còn lại — nếu dùng chung một y cho mọi thành viên, ensemble sẽ bị "co hẹp" giả tạo (underestimate uncertainty)</li></ul>
`, 'Reichle et al. 2002, EnKF trong thủy văn — Monthly Weather Review'));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Sai số tương quan không gian của SWOT — thách thức riêng</h1>
<ul class="bullets"><li>Nhắc lại Module 2: sai số quan sát KaRIn <b>có cấu trúc tương quan không gian</b> — các pixel/Node lân cận không có sai số độc lập như altimetry cổ điển</li><li>Hệ quả: ma trận hiệp phương sai sai số quan sát <b>Γ không thể coi là ma trận đường chéo đơn giản</b> (mỗi quan sát độc lập) — cần mô hình hoá tường minh phần ngoài đường chéo (off-diagonal)</li><li>Nếu bỏ qua tương quan này (giả định sai Γ đường chéo), thuật toán sẽ <b>đánh giá quá cao độ tin cậy</b> của quan sát SWOT, khiến K quá lớn một cách không chính đáng</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Kỹ thuật giảm sai số tương quan trước khi đồng hoá</h1>
<ul class="bullets"><li>Trước khi đưa dữ liệu SWOT vào vòng lặp EnKF, cần bước tiền xử lý <b>ước lượng và giảm phần sai số tương quan</b> — vd phân tách sai số thành phần biến đổi chậm theo không gian (dễ tương quan) và phần nhiễu độc lập từng pixel</li><li>Đây là một hướng nghiên cứu đang tích cực phát triển, kết hợp giữa thống kê không gian (geostatistics) và lý thuyết lọc Kalman cổ điển</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Jacques Verron — từ hải dương học đến thủy văn lục địa</h1>
<ul class="bullets"><li>Jacques Verron (CNRS/LEGOS) là một trong những người đặt nền móng ứng dụng Kalman/Ensemble Kalman Filter cho đồng hoá dữ liệu <b>altimetry đại dương</b> từ đầu những năm 1990 (cùng thời kỳ TOPEX/Poseidon, Module 1)</li><li>Công trình nền tảng: <i>"Altimeter data assimilation into an ocean circulation model"</i> (JGR: Oceans, 1990) — một trong các ứng dụng sớm nhất của lọc Kalman cho dữ liệu vệ tinh đại dương</li><li>Hướng nghiên cứu hiện tại: mở rộng cùng khung lý thuyết đó sang <b>thủy văn lục địa</b> với dữ liệu wide-swath SWOT — thách thức riêng là sai số tương quan không gian (slide trước), khác biệt so với bối cảnh đại dương gốc</li></ul>
`, 'Verron (1990), JGR: Oceans'));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Ứng dụng thực tế: cập nhật mô hình thủy văn bằng SWOT</h1>
<ul class="bullets"><li>Mô hình thủy văn/thủy lực quy mô lưu vực dự báo dòng chảy dựa trên mưa, bốc hơi, địa hình — nhưng tích lũy sai số theo thời gian nếu không được "neo" lại bằng quan sát thực</li><li>Mỗi khi SWOT bay qua một đoạn sông (chu kỳ 21 ngày, Module 2), EnKF cập nhật lại trạng thái mô hình (mực nước, có thể cả lưu lượng — Module 4) tại đúng đoạn đó</li><li>Giữa hai lần quan sát, mô hình tiếp tục chạy dự báo — chu kỳ forecast/analysis lặp lại liên tục (slide sơ đồ đầu module)</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Sai lầm thường gặp — bỏ qua bias hệ thống trước khi đồng hoá</h1>
<div class="pitfall"><span class="tag-warn">Đồng hoá dữ liệu có bias chưa hiệu chỉnh</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">Kalman Filter/EnKF giả định sai số không thiên lệch (zero-mean) — nếu quan sát hoặc mô hình có bias hệ thống chưa được phát hiện/hiệu chỉnh (vd sai lệch datum từ Module 1, hoặc mô hình thủy văn có xu hướng dự báo thấp/cao một cách nhất quán), bộ lọc sẽ hội tụ về một giá trị SAI một cách tự tin — tệ hơn cả việc không đồng hoá gì.</p></div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Data Assimilation</div>
<h1>Tự kiểm tra</h1>
<div class="checkpoint"><div class="q">❓ Kalman gain K lớn khi nào, nhỏ khi nào?</div><div class="a">K lớn khi mô hình rất bất định (P lớn) so với quan sát tin cậy (R nhỏ) — phân tích nghiêng về quan sát. K nhỏ khi ngược lại — giữ gần dự báo mô hình.</div></div><div class="checkpoint"><div class="q">❓ EnKF giải quyết vấn đề gì mà Kalman Filter chuẩn không làm được?</div><div class="a">EnKF tránh phải tính tường minh ma trận hiệp phương sai P cực lớn ở bài toán quy mô lưu vực, bằng cách xấp xỉ P bằng hiệp phương sai mẫu từ N thành viên ensemble chạy song song.</div></div><div class="checkpoint"><div class="q">❓ Vì sao sai số tương quan không gian của SWOT là một thách thức riêng cho EnKF?</div><div class="a">Vì ma trận Γ (sai số quan sát) không thể coi là đường chéo đơn giản — bỏ qua tương quan này khiến thuật toán đánh giá quá cao độ tin cậy quan sát, làm K lớn sai lệch.</div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 5 · Tóm tắt</div>
<h1>Ba điều cốt lõi mang sang Module 6</h1>
<div class="recap-item"><span class="ico">⚖️</span><span class="txt"><b>K = PHᵀ(HPHᵀ+R)⁻¹</b> là công thức trọng tâm — cân bằng giữa tin mô hình và tin quan sát, dùng lại nguyên lý này ở mọi ứng dụng dự báo lũ (Module 6).</span></div><div class="recap-item"><span class="ico">🎲</span><span class="txt">EnKF (ensemble) là công cụ thực tế duy nhất khả thi cho bài toán quy mô lưu vực lớn — nền tảng cho các hệ thống dự báo lũ vận hành thời gian thực.</span></div><div class="recap-item"><span class="ico">🔗</span><span class="txt">Sai số tương quan không gian của SWOT (Module 2) đòi hỏi xử lý đặc biệt trước khi đồng hoá — một lĩnh vực nghiên cứu đang mở, liên hệ trực tiếp thách thức giám sát xuyên biên giới ở Module 6.</span></div>
`));

slide(wrap(`
<div class="slide-inner divider fadein"><div class="modnum">6</div><div class="kicker">Kiến thức nền tảng VSEO6</div><h1>Flood Monitoring & Quản lý xuyên biên giới</h1><p class="sub">Nơi mọi kỹ thuật từ 5 module trước hội tụ thành ứng dụng thực tế — giám sát lũ và chia sẻ nước công bằng giữa các quốc gia.</p><div class="modmap"><span class="">1 · Nadir Altimetry</span><span class="">2 · SWOT / KaRIn</span><span class="">3 · Hydroweb-next</span><span class="">4 · Discharge (Q)</span><span class="">5 · Data Assimilation</span><span class="cur">6 · Flood & Xuyên biên giới</span></div></div>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Giám sát lũ bằng vệ tinh — tổng quan phương pháp</h1>
<ul class="bullets"><li>Ba loại cảm biến chính bổ sung cho nhau: <b>SAR</b> (Sentinel-1, xuyên mây), <b>quang học</b> (Sentinel-2, khi quang mây), và <b>altimetry cao độ/độ dốc</b> (Module 1-2)</li><li>Lũ thường xảy ra cùng lúc với <b>mây dày</b> — đây là lý do SAR đóng vai trò trung tâm trong giám sát lũ khẩn cấp, bất chấp thời tiết</li><li>Kết hợp cả ba nguồn cho bức tranh đầy đủ: <b>ranh giới vùng ngập</b> (SAR/quang học) + <b>độ sâu/độ dốc nước lũ</b> (altimetry)</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>SAR (Sentinel-1): nguyên lý phát hiện ngập lụt</h1>
<ul class="bullets"><li>Radar khẩu độ tổng hợp (Synthetic Aperture Radar) tự phát tín hiệu và thu tín hiệu phản xạ — hoạt động <b>cả ngày lẫn đêm</b>, <b>xuyên qua mây</b> (khác quang học)</li><li>Nguyên lý phát hiện nước: mặt nước phẳng phản xạ tín hiệu radar theo kiểu <b>gương (specular)</b> — hầu hết năng lượng bật ra xa ăng-ten thay vì phản xạ ngược lại → tín hiệu thu về (backscatter) <b>rất thấp</b>, tương phản rõ với mặt đất gồ ghề xung quanh</li><li>Thuật toán cơ bản: ngưỡng hoá (thresholding) ảnh backscatter — vùng có giá trị dưới ngưỡng được gán nhãn "nước"</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Hạn chế thực tế của SAR trong lập bản đồ ngập</h1>
<div class="pitfall"><span class="tag-warn">Hai nguồn nhiễu chính</span><p style="margin:0;font-size:14.5px;color:var(--ink);line-height:1.6">① Double-bounce trong đô thị: tín hiệu radar phản xạ 2 lần giữa mặt nước và tường nhà tạo tín hiệu MẠNH bất thường tại khu ngập đô thị, dễ bị nhầm là không có nước. ② Gió mạnh làm gợn sóng mặt nước, phá vỡ phản xạ specular, khiến vùng ngập bị đánh giá THẤP hơn thực tế (backscatter tăng giả tạo).</p></div>
<ul class="bullets"><li>Thảm thực vật ngập một phần (lúa nước, rừng ngập mặn) cũng cho tín hiệu phức tạp — không đơn thuần là ngưỡng cao/thấp</li></ul>
`));

slide(wrap(`
<div class="eyebrow">Module 6 · Flood & Transboundary</div>
<h1>Quang học (Sentinel-2) bổ sung khi điều kiện cho phép</h1>

`));

/* ============ ENGINE ============ */
const deck = document.getElementById('deck');
SLIDES.forEach(html => {
  const div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = html;
  deck.appendChild(div);
});
let idx = 0;
const total = SLIDES.length;
function render(){
  deck.style.transform = `translateX(-${idx*100}vw)`;
  document.getElementById('progress').style.width = ((idx+1)/total*100) + '%';
  const cur = deck.children[idx];
  let num = cur.querySelector('.slidenum');
  deck.querySelectorAll('.slidenum').forEach(e=>e.remove());
  const n = document.createElement('div');
  n.className = 'slidenum';
  n.textContent = (idx+1) + ' / ' + total;
  cur.appendChild(n);
  cur.querySelectorAll('.fadein').forEach(el=>{ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; });
}
function go(delta){ idx = Math.max(0, Math.min(total-1, idx+delta)); render(); }
document.addEventListener('keydown', e=>{
  if (['ArrowRight','PageDown',' '].includes(e.key)) { go(1); e.preventDefault(); }
  else if (['ArrowLeft','PageUp'].includes(e.key)) { go(-1); e.preventDefault(); }
  else if (e.key === 'Home') { idx=0; render(); }
  else if (e.key === 'End') { idx=total-1; render(); }
});
document.addEventListener('click', e=>{
  const w = window.innerWidth;
  if (e.clientX > w*0.6) go(1); else if (e.clientX < w*0.4) go(-1);
});
render();
</script>
