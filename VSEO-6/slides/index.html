<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSEO6 — Satellite Altimetry for Continental Water Monitoring</title>
<style>
:root{
  --bg:#0b1220; --panel:#101b30; --panel2:#132140; --line:#25406b;
  --ink:#eaf0ff; --ink-dim:#9fb2d6; --accent:#4fd1c5; --accent2:#f2b84b;
  --nadir:#7aa7ff; --swot:#4fd1c5; --danger:#ff7a7a; --good:#7ee08a;
  --sw: 1160px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
#deck{position:relative;width:100vw;height:100vh;display:flex;
  transition:transform .45s cubic-bezier(.65,0,.35,1)}
.slide{flex:0 0 100vw;height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:48px 64px;position:relative}
.slide-inner{width:100%;max-width:var(--sw)}
.eyebrow{color:var(--accent);font-size:15px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
h1{font-size:40px;line-height:1.2;margin:0 0 18px;font-weight:800;letter-spacing:-.01em}
h2{font-size:29px;line-height:1.3;margin:0 0 22px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
p.lead{font-size:18px;color:var(--ink-dim);line-height:1.6;max-width:820px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card h3{margin:0 0 8px;font-size:16px;color:var(--accent2)}
.card p{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.55}
ul.bullets{margin:0;padding-left:20px;font-size:16px;line-height:1.75;color:var(--ink)}
ul.bullets li{margin-bottom:8px}
ul.bullets b{color:var(--accent2)}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:4px 12px;font-size:12.5px;color:var(--ink-dim);margin-right:6px}
.tag{display:inline-block;background:rgba(79,209,197,.15);color:var(--accent);border:1px solid rgba(79,209,197,.4);
  border-radius:7px;padding:2px 9px;font-size:12px;font-weight:700;letter-spacing:.04em}
.tag.warn{background:rgba(255,122,122,.12);color:var(--danger);border-color:rgba(255,122,122,.35)}
.tag.good{background:rgba(126,224,138,.12);color:var(--good);border-color:rgba(126,224,138,.35)}
.footcite{position:absolute;bottom:26px;left:64px;right:64px;font-size:11.5px;color:#5c6f96;
  border-top:1px solid var(--line);padding-top:8px}
.footcite a{color:#7d92c2}
.slidenum{position:absolute;bottom:26px;right:64px;font-size:12px;color:#5c6f96}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:50;transition:width .4s}
.navhint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:#425079;
  letter-spacing:.05em;z-index:50}
.center{text-align:center}
.cover .kicker{color:var(--accent2);font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:16px}
.cover h1{font-size:52px}
.cover .sub{font-size:19px;color:var(--ink-dim);max-width:760px;margin:0 auto 26px}
.cover .meta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* ---- schedule grid ---- */
.sched-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:10px}
.sched-day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 12px;font-size:12.5px}
.sched-day .d{font-weight:800;color:var(--accent2);margin-bottom:2px;font-size:13px}
.sched-day .t{color:var(--ink-dim);margin-bottom:8px;font-size:11.5px}
.sched-day ul{margin:0;padding-left:14px;line-height:1.55;color:var(--ink)}

/* ---- module nav / roadmap ---- */
.roadmap{display:flex;flex-direction:column;gap:10px}
.rstep{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 18px}
.rstep .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--accent);
  color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.rstep .t{font-size:15.5px;font-weight:700}
.rstep .s{font-size:12.5px;color:var(--ink-dim)}

/* ---- speaker cards ---- */
.spk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.spk h3{margin:0 0 3px;font-size:16.5px;color:var(--ink)}
.spk .aff{font-size:12.5px;color:var(--accent);margin-bottom:8px}
.spk ul{margin:0;padding-left:16px;font-size:12px;line-height:1.55;color:var(--ink-dim)}

/* ---- SVG diagram scaffolding ---- */
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
svg text{font-family:inherit}
.lbl{fill:var(--ink);font-size:13px}
.lbl-dim{fill:var(--ink-dim);font-size:11.5px}
.lbl-accent{fill:var(--accent);font-size:12px;font-weight:700}

/* radar pulse: nadir round trip */
@keyframes pulseDown{
  0%{ transform:translateY(0); opacity:1; }
  48%{ transform:translateY(150px); opacity:1; }
  50%{ transform:translateY(150px); opacity:0; }
  100%{ transform:translateY(150px); opacity:0; }
}
@keyframes pulseUp{
  0%{ transform:translateY(150px); opacity:0; }
  50%{ transform:translateY(150px); opacity:0; }
  52%{ transform:translateY(150px); opacity:1; }
  100%{ transform:translateY(0); opacity:1; }
}
.pulse-down{animation:pulseDown 2.6s ease-in-out infinite}
.pulse-up{animation:pulseUp 2.6s ease-in-out infinite}

/* satellite moving along track (KaRIn) */
@keyframes flyRight{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(430px); }
}
.fly{animation:flyRight 6s linear infinite}

/* EnKF cycle: rotating highlight around loop, translate-based (no rotation-direction ambiguity) */
@keyframes dashFlow{ to{ stroke-dashoffset:-200; } }
.flow-line{stroke-dasharray:6 6; animation:dashFlow 3s linear infinite}

.fadein{animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div id="deck"></div>
<div class="navhint">← → hoặc Space để chuyển slide &nbsp;·&nbsp; số slide hiện tại ở góc dưới phải</div>

<script>
/* ============ SLIDE CONTENT ============ */
const SLIDES = [];
function slide(html){ SLIDES.push(html); }
function wrap(inner, cite){
  return '<div class="slide-inner">' + inner + '</div>' +
    (cite ? '<div class="footcite">Nguồn: ' + cite + '</div>' : '');
}

/* ---------- 1. Cover ---------- */
slide(`
<div class="slide-inner cover center fadein">
  <div class="kicker">The 6th Vietnam School of Earth Observation</div>
  <h1>VSEO6 — Satellite Altimetry</h1>
  <div class="sub">A Tool for Continental Water Monitoring — tài liệu lý thuyết tự học trước khóa học,
  tổng hợp từ chương trình giảng dạy chính thức và hồ sơ công bố khoa học của giảng viên.</div>
  <div class="meta">
    <span class="pill">📍 ICISE, Quy Nhơn</span>
    <span class="pill">🗓️ 7–12 tháng 9, 2026</span>
    <span class="pill">🏛️ Rencontres du Vietnam · đối tác UNESCO</span>
  </div>
</div>`);

/* ---------- 2. Course overview ---------- */
slide(wrap(`
  <div class="eyebrow">Tổng quan hội thảo</div>
  <h1>Trang bị kỹ năng giám sát nước lục địa bằng vệ tinh, từ dữ liệu thô tới ứng dụng thực tế</h1>
  <div class="grid2" style="margin-top:20px">
    <ul class="bullets">
      <li><b>Đối tượng:</b> nhà nghiên cứu trẻ, kỹ sư, giáo dục viên muốn phát triển kỹ năng satellite altimetry cho continental waters</li>
      <li><b>Tổ chức:</b> Rencontres du Vietnam (sáng lập 1993 bởi GS. Trần Thanh Vân), đối tác chính thức UNESCO</li>
      <li><b>Địa điểm:</b> ICISE — International Centre for Interdisciplinary Science Education, Quy Nhơn</li>
      <li><b>Đầu mối:</b> Dr. Laetitia Gal — laetitia.gal@hydro-matters.fr</li>
    </ul>
    <div class="card">
      <h3>5 năng lực đầu ra</h3>
      <p>① Xử lý dữ liệu vệ tinh thô &nbsp;② Tạo/trực quan hóa chuỗi thời gian mực nước
      &nbsp;③ Sử dụng dữ liệu Copernicus &amp; SWOT &nbsp;④ Ứng dụng giám sát tài nguyên nước &amp; thảm họa
      &nbsp;⑤ Tích hợp vệ tinh vào mô hình thủy văn (data assimilation)</p>
    </div>
  </div>
`, 'icisequynhon.com/conferences/2026/VSEO-6/'));

/* ---------- 3. Schedule grid ---------- */
function schedDay(d,t,items){
  return `<div class="sched-day"><div class="d">${d}</div><div class="t">${t}</div><ul>${items.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;
}
slide(wrap(`
  <div class="eyebrow">Lịch trình</div>
  <h1>5 ngày, 5 chủ đề nối tiếp — từ altimetry cổ điển tới ứng dụng thảm họa</h1>
  <div class="sched-grid">
    ${schedDay('T2 · 7/9','Khai mạc + Nadir',[
      'Khai mạc; giới thiệu USTH/CNES/VNSC/PSA/MRC',
      'Tổng quan Nadir altimetry',
      'Thực hành: tải & phân tích dữ liệu Nadir'])}
    ${schedDay('T3 · 8/9','SWOT Mission',[
      'Tổng quan SWOT + sản phẩm dữ liệu',
      'Thực hành: tải, trích xuất, trực quan hóa',
      'Ứng dụng SWOT & thảo luận'])}
    ${schedDay('T4 · 9/9','Thực địa + Mô hình',[
      'Thực địa: quan sát mực nước hồ chứa',
      'Chuyển tiếp dữ liệu vệ tinh → mô hình thủy văn',
      'Thực hành mô phỏng'])}
    ${schedDay('T5 · 10/9','hydroweb.next + DA',[
      'Giới thiệu hydroweb.next',
      'Nguyên lý đồng hóa dữ liệu',
      'Thực hành đồng hóa dữ liệu'])}
    ${schedDay('T6 · 11/9','Flood + Bế mạc',[
      'Giám sát lũ lụt & quản lý thảm họa',
      'Thực hành: trường hợp lũ lụt',
      'Bàn tròn / phản hồi / bế mạc'])}
  </div>
`, 'icisequynhon.com/conferences/2026/VSEO-6/program.html'));

/* ---------- 4. Roadmap of modules ---------- */
slide(wrap(`
  <div class="eyebrow">Lộ trình học</div>
  <h1>7 module lý thuyết bám sát đúng trình tự chương trình giảng dạy</h1>
  <div class="roadmap">
    <div class="rstep"><div class="n">1</div><div><div class="t">Nadir Satellite Altimetry</div><div class="s">Nguyên lý radar time-of-flight, virtual station, hạn chế độ phủ</div></div></div>
    <div class="rstep"><div class="n">2</div><div><div class="t">SWOT Mission</div><div class="s">KaRIn wide-swath, elevation–slope–width, ước tính discharge</div></div></div>
    <div class="rstep"><div class="n">3</div><div><div class="t">Copernicus &amp; Sentinel</div><div class="s">SAR Sentinel-1, quang học Sentinel-2, chính sách dữ liệu mở</div></div></div>
    <div class="rstep"><div class="n">4</div><div><div class="t">hydroweb.next</div><div class="s">Nền tảng tập trung hóa dữ liệu thủy văn vệ tinh (CNES/Theia)</div></div></div>
    <div class="rstep"><div class="n">5</div><div><div class="t">Data Assimilation</div><div class="s">Ensemble Kalman Filter, đồng hóa quan trắc vào mô hình routing</div></div></div>
    <div class="rstep"><div class="n">6</div><div><div class="t">Flood &amp; Transboundary Monitoring</div><div class="s">SAR + SWOT cho lũ lụt; quản lý sông Mekong xuyên biên giới</div></div></div>
    <div class="rstep"><div class="n">7</div><div><div class="t">Tổ chức &amp; Giảng viên</div><div class="s">Ai dạy gì, công tác ở đâu, công bố khoa học tiêu biểu</div></div></div>
  </div>
`));

/* ---------- 5. Module 1a: Nadir principle ---------- */
slide(wrap(`
  <div class="eyebrow">Module 1 · Nadir Altimetry</div>
  <h1>Radar nhìn thẳng xuống đo thời gian bay đi–về để suy ra cao độ mặt nước</h1>
  <div class="grid2">
    <ul class="bullets">
      <li>Vệ tinh phát xung radar <b>thẳng xuống (nadir)</b>, đo <b>thời gian bay đi–về (time-of-flight)</b> của tín hiệu</li>
      <li>Khoảng cách vệ tinh–mặt nước = (thời gian × vận tốc ánh sáng) / 2</li>
      <li>Biết quỹ đạo vệ tinh chính xác ⇒ suy ra <b>cao độ tuyệt đối</b> mặt nước</li>
      <li>Công nghệ cổ điển: TOPEX/Poseidon (1992) → Jason 1/2/3 → Sentinel-6</li>
    </ul>
    <div class="diagram">
      <svg viewBox="0 0 340 220" width="100%">
        <rect x="0" y="185" width="340" height="35" fill="#0c1830"/>
        <text x="170" y="207" text-anchor="middle" class="lbl-dim">mặt nước sông</text>
        <g transform="translate(150,20)">
          <rect x="-14" y="-10" width="28" height="18" rx="3" fill="#1b2c52" stroke="var(--nadir)"/>
          <text x="0" y="-16" text-anchor="middle" class="lbl-accent" style="fill:var(--nadir)">vệ tinh</text>
          <line x1="0" y1="8" x2="0" y2="165" stroke="#28406e" stroke-width="1" stroke-dasharray="3 4"/>
          <circle class="pulse-down" cx="0" cy="8" r="5" fill="var(--nadir)"/>
          <circle class="pulse-up" cx="0" cy="8" r="5" fill="var(--accent2)"/>
        </g>
        <text x="170" y="118" text-anchor="middle" class="lbl-dim" font-size="11">Δt = thời gian đi (xanh) + về (vàng)</text>
      </svg>
    </div>
  </div>
`, 'eoportal.org/satellite-missions/swot · nguyên lý altimetry cổ điển'));

/* ---------- 6. Module 1b: virtual station & limits ---------- */
slide(wrap(`
  <div class="eyebrow">Module 1 · Nadir Altimetry</div>
  <h1>Chỉ đo được tại nơi vệt bay cắt sông — đây là giới hạn cốt lõi của nadir</h1>
  <div class="grid2">
    <div class="diagram">
      <svg viewBox="0 0 340 220" width="100%">
        <path d="M20,190 C120,120 180,80 320,20" stroke="#28406e" stroke-width="10" fill="none" opacity=".5"/>
        <text x="30" y="205" class="lbl-dim" font-size="11">sông</text>
        <line x1="60" y1="10" x2="60" y2="210" stroke="var(--nadir)" stroke-width="2"/>
        <line x1="180" y1="10" x2="180" y2="210" stroke="var(--nadir)" stroke-width="2"/>
        <line x1="280" y1="10" x2="280" y2="210" stroke="var(--nadir)" stroke-width="2"/>
        <text x="60" y="20" text-anchor="middle" class="lbl-accent" style="fill:var(--nadir)">vệt bay</text>
        <circle cx="72" cy="163" r="5" fill="var(--accent2)"/>
        <circle cx="180" cy="97" r="5" fill="var(--accent2)"/>
        <circle cx="280" cy="45" r="5" fill="var(--accent2)"/>
        <text x="72" y="182" text-anchor="middle" class="lbl-dim" font-size="10">virtual<br/>station</text>
        <text x="180" y="116" text-anchor="middle" class="lbl-dim" font-size="10">virtual station</text>
        <text x="280" y="64" text-anchor="middle" class="lbl-dim" font-size="10">virtual station</text>
      </svg>
      <div class="center" style="margin-top:6px"><span class="tag warn">chỉ có dữ liệu tại 3 điểm rời rạc trên toàn con sông</span></div>
    </div>
    <ul class="bullets">
      <li><b>Virtual station:</b> điểm giao cắt giữa vệt bay vệ tinh và một sông/hồ — nơi duy nhất có chuỗi thời gian mực nước</li>
      <li>Chu kỳ lặp quỹ đạo (10–35 ngày) quyết định <b>tần suất lấy mẫu</b> tại mỗi điểm</li>
      <li>Sản phẩm: chuỗi thời gian cao độ mực nước (water level time series) tại từng virtual station</li>
      <li><b>Không</b> cho ảnh 2D của mặt nước — không đo trực tiếp độ rộng hay độ dốc</li>
    </ul>
  </div>
`));

/* ---------- 7. Module 2a: SWOT overview ---------- */
slide(wrap(`
  <div class="eyebrow">Module 2 · SWOT Mission</div>
  <h1>SWOT — bước nhảy vọt từ "điểm đo" sang "ảnh 2D" của mặt nước</h1>
  <div class="grid3">
    <div class="card"><h3>Tên đầy đủ</h3><p>Surface Water and Ocean Topography — hợp tác NASA–CNES, đóng góp từ CSA và UKSA</p></div>

  </div>

/* ---------- 8. Module 2b: KaRIn swath architecture ---------- */
slide(wrap(`
  <div class="eyebrow">Module 2 · SWOT Mission</div>
  <h1>KaRIn quét hai dải 50 km hai bên, có một khoảng trống ngay tại đường nadir</h1>
  <div class="grid2">

        <rect x="240" y="10" width="60" height="200" fill="var(--swot)" opacity=".18"/>

/* ---------- 9. Module 2c: SWOT vs Nadir comparison ---------- */
slide(wrap(`
  <div class="eyebrow">Module 2 · SWOT Mission</div>
  <h1>Đối chiếu trực tiếp: điểm rời rạc theo thời gian, hay ảnh liên tục theo không gian?</h1>

slide(wrap(`
  <div class="eyebrow">Toán học nền tảng</div>
  <h1>Bốn phương trình xuyên suốt khóa học — từ đo khoảng cách đến ước tính lưu lượng</h1>
  <div class="grid2">
    <div class="card">
      <h3>① Range equation (nadir altimetry)</h3>
      <p style="font-family:Cambria,'Times New Roman',serif;font-size:15px">R = c · Δt / 2</p>
      <p style="color:var(--ink-dim);font-size:12.5px">c: vận tốc ánh sáng · Δt: thời gian đi–về của xung radar. Độ cao: h = H<sub>sat</sub> − (R + Σ hiệu chỉnh khí quyển)</p>
    </div>
    <div class="card">
      <h3>② KaRIn — pha → góc nhìn → độ cao</h3>
      <p style="font-family:Cambria,'Times New Roman',serif;font-size:15px">Δφ = k·B·sin(θ) &nbsp;·&nbsp; h = H − r₁cos(θ)</p>
      <p style="color:var(--ink-dim);font-size:12.5px">B = baseline 10m giữa 2 ăng-ten · θ: góc nhìn suy từ độ lệch pha Δφ</p>
    </div>
    <div class="card">
      <h3>③ Manning — lưu lượng từ W, h, S</h3>
      <p style="font-family:Cambria,'Times New Roman',serif;font-size:15px">V = (1/n)·R<sub>h</sub><sup>2/3</sup>·S<sup>1/2</sup> &nbsp;·&nbsp; Q = A·V</p>
      <p style="color:var(--ink-dim);font-size:12.5px">A (mặt cắt ướt) và n (nhám) là ẩn số — suy luận bằng BAM/AMHG từ chuỗi W-h-S của SWOT</p>
    </div>
    <div class="card">
      <h3>④ Kalman gain — lõi của data assimilation</h3>
      <p style="font-family:Cambria,'Times New Roman',serif;font-size:15px">K = P·H<sup>T</sup>(H·P·H<sup>T</sup> + R)<sup>−1</sup></p>
      <p style="color:var(--ink-dim);font-size:12.5px">P lớn (mô hình bất định) so với R nhỏ (quan sát tốt) ⇒ K lớn ⇒ tin quan sát hơn. EnKF thay P bằng hiệp phương sai mẫu từ N ensemble khi P quá lớn để tính tường minh.</p>
    </div>
  </div>
  <p class="lead" style="margin-top:16px">Chi tiết từng phương trình + nguồn trích dẫn: mục <b>1.7–1.14</b> trong <code>01_ly_thuyet_va_giang_vien.md</code> và tab "Lý thuyết" trên website luyện tập.</p>
`));

/* ============ ENGINE ============ */
const deck = document.getElementById('deck');
SLIDES.forEach(html => {
  const div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = html;
  deck.appendChild(div);
});
let idx = 0;
const total = SLIDES.length;
function render(){
  deck.style.transform = `translateX(-${idx*100}vw)`;
  document.getElementById('progress').style.width = ((idx+1)/total*100) + '%';
  const cur = deck.children[idx];
  let num = cur.querySelector('.slidenum');
  deck.querySelectorAll('.slidenum').forEach(e=>e.remove());
  const n = document.createElement('div');
  n.className = 'slidenum';
  n.textContent = (idx+1) + ' / ' + total;
  cur.appendChild(n);
  cur.querySelectorAll('.fadein').forEach(el=>{ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; });
}
function go(delta){ idx = Math.max(0, Math.min(total-1, idx+delta)); render(); }
document.addEventListener('keydown', e=>{
  if (['ArrowRight','PageDown',' '].includes(e.key)) { go(1); e.preventDefault(); }
  else if (['ArrowLeft','PageUp'].includes(e.key)) { go(-1); e.preventDefault(); }
  else if (e.key === 'Home') { idx=0; render(); }
  else if (e.key === 'End') { idx=total-1; render(); }
});
document.addEventListener('click', e=>{
  const w = window.innerWidth;
  if (e.clientX > w*0.6) go(1); else if (e.clientX < w*0.4) go(-1);
});
render();
</script>
