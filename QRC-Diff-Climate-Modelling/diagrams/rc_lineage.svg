<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1948 170" width="100%" font-family="sans-serif"><rect width="1948" height="170" fill="#ffffff"/><text x="974.0" y="20" font-size="15" font-weight="800" fill="#273896" text-anchor="middle">Dòng lịch sử Reservoir Computing: RNN → ESN/LSM → QRC → spin-chain tunable memory</text><line x1="40" y1="95" x2="1908" y2="95" stroke="#ED1C24" stroke-width="2.5" opacity=".6"/><circle cx="86" cy="95" r="6" fill="#273896" stroke="#fff" stroke-width="1.5"/><text x="86" y="79" font-size="12.5" font-weight="700" fill="#1d2433" text-anchor="middle">RNN/BPTT</text><text x="86" y="94" font-size="10.5" fill="#5d6678" text-anchor="middle">vanishing gradient</text><circle cx="592" cy="95" r="6" fill="#273896" stroke="#fff" stroke-width="1.5"/><text x="592" y="129" font-size="12.5" font-weight="700" fill="#1d2433" text-anchor="middle">ESN</text><text x="592" y="114" font-size="10.5" fill="#5d6678" text-anchor="middle">Jaeger — reservoir ngẫu nhiên cố định</text><circle cx="638" cy="95" r="6" fill="#273896" stroke="#fff" stroke-width="1.5"/><text x="638" y="79" font-size="12.5" font-weight="700" fill="#1d2433" text-anchor="middle">LSM</text><text x="638" y="94" font-size="10.5" fill="#5d6678" text-anchor="middle">Maass — mạng xung sinh học</text><circle cx="1006" cy="95" r="6" fill="#273896" stroke="#fff" stroke-width="1.5"/><text x="1006" y="129" font-size="12.5" font-weight="700" fill="#1d2433" text-anchor="middle">Fading memory</text><text x="1006" y="114" font-size="10.5" fill="#5d6678" text-anchor="middle">điều kiện lý thuyết RC</text><circle cx="1328" cy="95" r="6" fill="#273896" stroke="#fff" stroke-width="1.5"/><text x="1328" y="79" font-size="12.5" font-weight="700" fill="#1d2433" text-anchor="middle">QRC</text><text x="1328" y="94" font-size="10.5" fill="#5d6678" text-anchor="middle">Fujii &amp; Nakajima — reservoir lượng tử</text><circle cx="1742" cy="95" r="6" fill="#273896" stroke="#fff" stroke-width="1.5"/><text x="1742" y="1